<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CYBER_SYS — CORE FINAL</title>
    <style>
        :root { 
            --neon-blue: #00f2ff; --neon-purple: #bc13fe; --neon-pink: #ff00de;
            --neon-gold: #ffcc00; --neon-green: #39ff14; --bg: #050505; --panel: rgba(15, 15, 20, 0.95); 
        }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }
        header { background: rgba(0,0,0,0.9); padding: 15px 5%; border-bottom: 2px solid var(--neon-purple); display: none; justify-content: space-between; align-items: center; position: sticky; top:0; z-index:100; }
        .nav-btn { background: transparent; color: var(--neon-blue); border: 1px solid var(--neon-blue); padding: 8px 16px; cursor: pointer; font-weight: bold; border-radius: 4px; text-transform: uppercase; font-size: 10px; transition: 0.3s; margin: 2px; }
        .nav-btn:hover { background: var(--neon-blue); color: #000; box-shadow: 0 0 15px var(--neon-blue); }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; display: none; grid-template-columns: 1fr 380px; gap: 25px; }
        .card { background: var(--panel); padding: 20px; border-radius: 15px; border: 1px solid rgba(0, 242, 255, 0.2); margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; background: rgba(255,255,255,0.05); border: 1px solid var(--neon-purple); border-radius: 5px; color: #fff; outline: none; box-sizing: border-box; }
        #auth-screen { position: fixed; inset: 0; background: #000; z-index: 10000; display: flex; justify-content: center; align-items: center; }
        .auth-box { background: #0a0a0a; padding: 35px; border-radius: 20px; border: 2px solid var(--neon-blue); width: 320px; text-align: center; }
        .badge { padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: bold; margin-left: 5px; color: #000; background: var(--neon-gold); }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="auth-box">
        <h1 style="color:var(--neon-blue); margin-top:0">CYBER_SYS</h1>
        <input type="text" id="u-login" placeholder="ЛОГИН">
        <input type="email" id="u-email" placeholder="EMAIL">
        <input type="password" id="u-pass" placeholder="ПАРОЛЬ">
        <button class="nav-btn" style="width:100%; padding:14px" onclick="auth()">ВХОД / РЕГИСТРАЦИЯ</button>
    </div>
</div>

<header id="header">
    <div style="display:flex; align-items:center; gap:12px">
        <img id="h-ava" src="" style="width:40px; height:40px; border-radius:50%; border:2px solid var(--neon-blue); object-fit:cover">
        <div><b id="h-name"></b><span id="h-badge"></span><br><small id="h-mail" style="opacity:0.5"></small></div>
    </div>
    <div style="display:flex; gap:5px">
        <button id="owner-btn" class="nav-btn" style="border-color:var(--neon-gold); color:var(--neon-gold); display:none" onclick="openPage('owner')">👑 УПРАВЛЕНИЕ</button>
        <button class="nav-btn" onclick="openPage('main')">ГЛАВНАЯ</button>
        <button class="nav-btn" style="border-color:red; color:red" onclick="logout()">ВЫЙТИ</button>
    </div>
</header>

<div class="container" id="main-content">
    <div id="pages">
        <div id="page-main">
            <div class="card">
                <h3>👥 КОНТАКТЫ</h3>
                <input type="text" id="f-search" placeholder="Поиск ника...">
                <button class="nav-btn" style="width:100%" onclick="addFriend()">ДОБАВИТЬ</button>
                <div id="f-list" style="margin-top:15px"></div>
            </div>
            <div class="card">
                <h3 style="color:var(--neon-pink)">🆘 СВЯЗЬ С CORE</h3>
                <textarea id="ticket-text" placeholder="Опишите проблему..."></textarea>
                <button class="nav-btn" style="width:100%; border-color:var(--neon-pink); color:var(--neon-pink)" onclick="sendTicket()">ОТПРАВИТЬ</button>
            </div>
        </div>

        <div id="page-owner" style="display:none">
            <div class="card">
                <h3>📩 ТИКЕТЫ (CORE ONLY)</h3>
                <div id="tickets-list"></div>
                <button class="nav-btn" style="margin-top:10px; border-color:red; color:red" onclick="clearTickets()">ОЧИСТИТЬ ВСЕ</button>
            </div>
        </div>
    </div>

    <div class="sidebar">
        <div class="card">
            <h4>💬 ЧАТ</h4>
            <div id="chat" style="height:350px; overflow-y:auto; font-size:13px; margin-bottom:10px"></div>
            <input type="text" id="chat-in" placeholder="Связь..." onkeypress="if(event.key==='Enter') sendMsg()">
        </div>
    </div>
</div>

<script>
    const OWNER_ID = "admin"; // Единственный создатель

    let db = JSON.parse(localStorage.getItem('cyber_final_db_clean')) || { users: {}, msgs: [], tickets: [] };
    let user = localStorage.getItem('cyber_active');

    function save() { localStorage.setItem('cyber_final_db_clean', JSON.stringify(db)); }

    function auth() {
        const l = document.getElementById('u-login').value.trim();
        const e = document.getElementById('u-email').value.trim();
        const p = btoa(document.getElementById('u-pass').value);
        if(!l || !p) return alert("Заполните поля!");

        if(!db.users[l]) {
            db.users[l] = { pass: p, email: e, friends: [], ava: "https://api.dicebear.com"+l };
        } else if(db.users[l].pass !== p) return alert("Ошибка!");

        user = l; localStorage.setItem('cyber_active', l); save(); location.reload();
    }

    if(user && db.users[user]) {
        const uData = db.users[user];
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('header').style.display = 'flex';
        document.getElementById('main-content').style.display = 'grid';
        document.getElementById('h-name').innerText = user;
        document.getElementById('h-mail').innerText = uData.email;
        document.getElementById('h-ava').src = uData.ava;

        if(user === OWNER_ID) {
            document.getElementById('owner-btn').style.display = 'block';
            document.getElementById('h-badge').innerHTML = '<span class="badge">OWNER</span>';
        }
        renderFriends(); renderChat();
    }

    function sendTicket() {
        const t = document.getElementById('ticket-text').value;
        if(!t) return;
        db.tickets.push({ from: user, text: t, date: new Date().toLocaleTimeString() });
        save(); alert("Сообщение доставлено."); document.getElementById('ticket-text').value = "";
    }

    function renderTickets() {
        const list = document.getElementById('tickets-list');
        list.innerHTML = db.tickets.map(t => `<div class="card" style="font-size:11px"><b>${t.from}:</b> ${t.text}</div>`).join('') || "Тикетов нет";
    }

    function clearTickets() { if(confirm("Удалить все?")) { db.tickets = []; save(); renderTickets(); } }

    function addFriend() {
        const n = document.getElementById('f-search').value.trim();
        if(db.users[n] && n !== user) { db.users[user].friends.push(n); save(); renderFriends(); }
    }
    function renderFriends() {
        document.getElementById('f-list').innerHTML = db.users[user].friends.map(f => `<div style="padding:10px; border-bottom:1px solid #333"><b>${f}</b></div>`).join('');
    }
    function sendMsg() {
        const i = document.getElementById('chat-in');
        db.msgs.push({ u: user, t: i.value }); save(); i.value = ""; renderChat();
    }
    function renderChat() {
        document.getElementById('chat').innerHTML = db.msgs.map(m => `<div><b>${m.u}:</b> ${m.t}</div>`).join('');
        document.getElementById('chat').scrollTop = 99999;
    }
    function openPage(p) {
        ["page-main", "page-owner"].forEach(id => document.getElementById(id).style.display = id.includes(p) ? 'block' : 'none');
        if(p === 'owner') renderTickets();
    }
    function logout() { localStorage.removeItem('cyber_active'); location.reload(); }
</script>
</body>
</html>
