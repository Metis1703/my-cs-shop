<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER_HUB — METIS OFFICIAL</title>
    <style>
        :root { 
            --neon-blue: #00f2ff; --neon-purple: #bc13fe; --neon-pink: #ff00de;
            --neon-gold: #ffcc00; --neon-green: #39ff14; --bg: #050505; --panel: rgba(15, 15, 20, 0.95); 
        }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; overflow: hidden; }
        header { background: rgba(0,0,0,0.9); padding: 10px 5%; border-bottom: 2px solid var(--neon-purple); display: none; justify-content: space-between; align-items: center; position: sticky; top:0; z-index:100; }
        .nav-btn { background: transparent; color: var(--neon-blue); border: 1px solid var(--neon-blue); padding: 6px 12px; cursor: pointer; font-weight: bold; border-radius: 4px; text-transform: uppercase; font-size: 10px; transition: 0.3s; }
        .nav-btn:hover { background: var(--neon-blue); color: #000; box-shadow: 0 0 15px var(--neon-blue); }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; display: none; grid-template-columns: 1fr 320px; gap: 20px; height: 85vh; }
        .card { background: var(--panel); padding: 20px; border-radius: 15px; border: 1px solid rgba(0, 242, 255, 0.2); margin-bottom: 20px; overflow-y: auto; }
        input, select { width: 100%; padding: 10px; margin: 5px 0; background: rgba(255,255,255,0.05); border: 1px solid var(--neon-purple); border-radius: 5px; color: #fff; outline: none; box-sizing: border-box; }
        #auth-screen { position: fixed; inset: 0; background: #000; z-index: 10000; display: flex; justify-content: center; align-items: center; }
        .auth-box { background: #0a0a0a; padding: 35px; border-radius: 20px; border: 2px solid var(--neon-blue); width: 300px; text-align: center; }
        .ava { width: 35px; height: 35px; border-radius: 50%; border: 1.5px solid var(--neon-blue); object-fit: cover; }
        #chat { height: 380px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
        .m-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        .m-item { border: 1px solid #222; padding: 10px; border-radius: 10px; text-align: center; background: rgba(255,255,255,0.02); position: relative; }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="auth-box">
        <h2 style="color:var(--neon-blue)">CYBER_HUB</h2>
        <input type="text" id="u-login" placeholder="ЛОГИН">
        <input type="password" id="u-pass" placeholder="ПАРОЛЬ">
        <button class="nav-btn" style="width:100%; padding:14px" id="auth-btn">CONNECT</button>
    </div>
</div>

<header id="header">
    <div style="display:flex; align-items:center; gap:10px">
        <img id="h-ava" class="ava" src="">
        <div><b id="h-name"></b> <span id="h-badge" style="color:var(--neon-gold)"></span><br><span id="h-bal" style="color:var(--neon-pink)">0</span> ₽</div>
    </div>
    <div style="display:flex; gap:4px">
        <button id="admin-btn" class="nav-btn" style="display:none; color:var(--neon-gold)" onclick="openPage('admin')">ADM</button>
        <button class="nav-btn" onclick="openPage('shop')">МАРКЕТ</button>
        <button class="nav-btn" onclick="openPage('main')">ПРОФИЛЬ</button>
        <button class="nav-btn" style="color:red" onclick="logout()">EXIT</button>
    </div>
</header>

<div class="container" id="main-content">
    <div id="pages">
        <div id="page-main" class="card">
            <h3>⚙️ ПРОФИЛЬ</h3>
            <input type="text" id="u-ava-input" placeholder="Ссылка на аватарку">
            <button class="nav-btn" onclick="saveAva()">ОБНОВИТЬ</button>
            <h3 style="margin-top:20px">🎒 ИНВЕНТАРЬ</h3>
            <div id="u-inv" class="m-grid"></div>
        </div>
        <div id="page-shop" class="card" style="display:none">
            <h3>💀 BLACK MARKET</h3>
            <div id="m-list" class="m-grid"></div>
        </div>
        <div id="page-admin" class="card" style="display:none">
            <h3>👑 АДМИН-ПАНЕЛЬ</h3>
            <select id="adm-user-list"></select>
            <input type="number" id="adm-give-bal" placeholder="Сумма ₽">
            <button class="nav-btn" onclick="adminGiveMoney()">ВЫДАТЬ</button>
            <hr style="margin:20px 0; border:0; border-top:1px solid #333">
            <input id="adm-n" placeholder="Имя"><input id="adm-p" type="number" placeholder="Цена"><input id="adm-link" placeholder="Файл">
            <button class="nav-btn" onclick="adminAddItem()">ДОБАВИТЬ</button>
        </div>
    </div>
    <div class="sidebar">
        <div class="card">
            <h4>💬 ЧАТ</h4>
            <div id="chat"></div>
            <input type="text" id="chat-in" placeholder="Текст..." onkeypress="if(event.key==='Enter') sendChat()">
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com";
    import { getDatabase, ref, set, get, update, push, onValue, remove } from "https://www.gstatic.com";

    // ПРОВЕРЕНО: База активна
    const firebaseConfig = { 
        databaseURL: "https://cyber-hub-metis-default-rtdb.firebaseio.com",
        projectId: "cyber-hub-metis" 
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const OWNER = "Metis";
    let user = localStorage.getItem('active_user');

    // Исправлено: Глобальные функции для кнопок в HTML
    window.openPage = (p) => {
        ['page-main', 'page-shop', 'page-admin'].forEach(id => document.getElementById(id).style.display = 'none');
        document.getElementById('page-' + p).style.display = 'block';
    };

    window.logout = () => { localStorage.removeItem('active_user'); location.reload(); };

    document.getElementById('auth-btn').onclick = async () => {
        const l = document.getElementById('u-login').value.trim();
        const p = document.getElementById('u-pass').value;
        if(!l || !p) return;
        
        const s = await get(ref(db, 'users/' + l));
        if(!s.exists()) {
            await set(ref(db, 'users/' + l), { pass: btoa(p), bal: 0, ava: "", inv: [] });
        } else if(atob(s.val().pass) !== p) return alert("НЕВЕРНЫЙ ПАРОЛЬ");

        localStorage.setItem('active_user', l);
        location.reload();
    };

    if(user) {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('header').style.display = 'flex';
        document.getElementById('main-content').style.display = 'grid';
        if(user === OWNER) document.getElementById('admin-btn').style.display = 'block';

        onValue(ref(db, 'users/' + user), (s) => {
            const data = s.val();
            document.getElementById('h-name').innerText = user;
            document.getElementById('h-bal').innerText = data.bal || 0;
            document.getElementById('h-ava').src = data.ava || `https://api.dicebear.com{user}`;
            document.getElementById('h-badge').innerText = (user === OWNER) ? "[OWNER]" : "";
            document.getElementById('u-inv').innerHTML = (data.inv || []).map(i => `
                <div class="m-item"><b>${i.n}</b><br><a href="${i.link}" target="_blank" style="color:var(--neon-blue)">СКАЧАТЬ</a></div>
            `).join('');
        });

        onValue(ref(db, 'msgs'), (s) => {
            const box = document.getElementById('chat');
            box.innerHTML = s.val() ? Object.values(s.val()).slice(-30).map(m => `<div><b>${m.u}:</b> ${m.t}</div>`).join('') : "";
            box.scrollTop = box.scrollHeight;
        });

        onValue(ref(db, 'market'), (s) => {
            const list = document.getElementById('m-list');
            list.innerHTML = s.val() ? Object.entries(s.val()).map(([id, i]) => `
                <div class="m-item">
                    ${user === OWNER ? `<button onclick="delItem('${id}')" style="position:absolute;top:2px;right:2px;background:red;color:white;border:none;font-size:8px">X</button>` : ''}
                    <b>${i.n}</b><br>${i.p} ₽<br>
                    <button class="nav-btn" style="width:100%" onclick="buy('${id}', ${i.p})">BUY</button>
                </div>
            `).join('') : "";
        });

        if(user === OWNER) onValue(ref(db, 'users'), (s) => {
            const list = document.getElementById('adm-user-list');
            list.innerHTML = Object.keys(s.val()).map(n => `<option value="${n}">${n}</option>`).join('');
        });
    }

    window.saveAva = () => update(ref(db, 'users/' + user), { ava: document.getElementById('u-ava-input').value });
    window.sendChat = () => {
        const i = document.getElementById('chat-in');
        if(i.value) push(ref(db, 'msgs'), { u: user, t: i.value });
        i.value = "";
    };
    window.buy = async (id, p) => {
        const s = await get(ref(db, 'users/' + user));
        if(s.val().bal < p) return alert("НЕДОСТАТОЧНО СРЕДСТВ");
        const item = (await get(ref(db, 'market/' + id))).val();
        const inv = s.val().inv || [];
        inv.push(item);
        update(ref(db, 'users/' + user), { bal: s.val().bal - p, inv: inv });
        alert("УСПЕШНО!");
    };
    window.adminGiveMoney = async () => {
        const t = document.getElementById('adm-user-list').value;
        const v = parseInt(document.getElementById('adm-give-bal').value);
        const cur = (await get(ref(db, 'users/' + t))).val().bal || 0;
        update(ref(db, 'users/' + t), { bal: cur + v });
    };
    window.adminAddItem = () => push(ref(db, 'market'), { 
        n: document.getElementById('adm-n').value, 
        p: parseInt(document.getElementById('adm-p').value), 
        link: document.getElementById('adm-link').value 
    });
    window.delItem = (id) => remove(ref(db, 'market/' + id));
</script>
</body>
</html>
