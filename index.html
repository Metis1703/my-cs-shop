<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CS 1.6 MARKET — ADMIN ACCESS</title>
    <style>
        :root { --primary: #5c7e10; --bg: #0a0a0a; --panel: #161616; --red: #c0392b; --text: #d1d1d1; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; }
        
        /* Вход */
        #auth-box { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .auth-card { background: var(--panel); padding: 30px; border: 2px solid var(--primary); width: 320px; text-align: center; border-radius: 10px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #000; border: 1px solid #333; color: #fff; border-radius: 5px; box-sizing: border-box; }
        
        header { background: #000; padding: 15px 5%; border-bottom: 2px solid var(--primary); display: flex; justify-content: space-between; align-items: center; }
        .nav-btn { background: var(--primary); color: #fff; border: none; padding: 10px 15px; cursor: pointer; font-weight: bold; border-radius: 4px; transition: 0.2s; }
        
        .container { padding: 30px 5%; max-width: 1000px; margin: 0 auto; }
        .card { background: var(--panel); padding: 20px; border-radius: 10px; border: 1px solid #222; margin-bottom: 20px; }

        /* Панель Админа */
        #admin-ui { display: none; border: 2px solid var(--red); background: #1a0a0a; }
        .admin-title { color: var(--red); font-weight: bold; text-transform: uppercase; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; display: flex; justify-content: space-between; }
        .danger-btn { background: var(--red); color: #fff; border: none; padding: 10px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 10px; border-radius: 4px; }
        
        .logs { background: #000; height: 100px; overflow-y: auto; padding: 10px; font-size: 11px; font-family: monospace; margin-top: 10px; border: 1px solid #333; }
    </style>
</head>
<body>

<div id="auth-box">
    <div class="auth-card">
        <h2 style="color: var(--primary);">CS-MARKET</h2>
        <p style="font-size: 12px; color: #666;">Введите данные для входа</p>
        <input type="text" id="l" placeholder="Логин">
        <input type="password" id="p" placeholder="Пароль">
        <button class="nav-btn" style="width:100%" onclick="auth()">ВОЙТИ / РЕГИСТРАЦИЯ</button>
        <p id="error-msg" style="color:var(--red); font-size: 11px; margin-top: 10px;"></p>
    </div>
</div>

<header>
    <div>Вы: <b id="me"></b> | Статус: <b id="role-text">Игрок</b> | Баланс: <b id="myb">0</b> ₽</div>
    <button class="nav-btn" style="background:#444" onclick="location.reload()">ВЫЙТИ</button>
</header>

<div class="container">
    <div class="card">
        <h3>🛒 Магазин</h3>
        <p>Комплект оружия "Elite" — 450 ₽</p>
        <button class="nav-btn" onclick="buy(450, 'Elite Weapon Pack')">КУПИТЬ</button>
    </div>

    <!-- СКРЫТАЯ АДМИН-ПАНЕЛЬ -->
    <div class="card" id="admin-ui">
        <div class="admin-title">
            <span>🛡️ ПАНЕЛЬ ГЛАВНОГО АДМИНИСТРАТОРА</span>
            <span style="font-size: 10px; color: #555;">Full Access</span>
        </div>
        
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div>
                <label>Выбрать игрока:</label>
                <select id="user-list"></select>
                <input type="number" id="new-bal" placeholder="Новая сумма баланса">
                <button class="nav-btn" style="width:100%; margin-top:5px" onclick="setBal()">ИЗМЕНИТЬ БАЛАНС</button>
            </div>
            <div>
                <label>Управление правами:</label>
                <button class="nav-btn" style="width:100%; background:#2980b9;" onclick="setRole('admin')">НАЗНАЧИТЬ АДМИНОМ</button>
                <button class="nav-btn" style="width:100%; background:#444; margin-top:5px;" onclick="setRole('user')">СНЯТЬ ПРАВА АДМИНА</button>
            </div>
        </div>

        <button class="danger-btn" onclick="delUser()">❌ УДАЛИТЬ АККАУНТ ИЗ БАЗЫ</button>
        <div class="logs" id="log-box"></div>
    </div>
</div>

<script>
    // --- ДАННЫЕ ВАШЕЙ АДМИНКИ ---
    const ROOT_ADMIN = {
        login: "admin",      // ВАШ ЛОГИН
        password: "777"      // ВАШ ПАРОЛЬ
    };

    let db = JSON.parse(localStorage.getItem('cs_final_v5')) || {};
    let logs = JSON.parse(localStorage.getItem('cs_logs_v5')) || [];
    let cur = null;

    function save() {
        localStorage.setItem('cs_final_v5', JSON.stringify(db));
        localStorage.setItem('cs_logs_v5', JSON.stringify(logs));
        update();
    }

    function addLog(t) {
        logs.unshift(`[${new Date().toLocaleTimeString()}] ${t}`);
        if(logs.length > 20) logs.pop();
        save();
    }

    function auth() {
        const u = document.getElementById('l').value.trim().toLowerCase();
        const p = document.getElementById('p').value;
        if(!u || !p) return;

        // ПРОВЕРКА: Если введен логин админа
        if(u === ROOT_ADMIN.login && p === ROOT_ADMIN.password) {
            if(!db[u]) db[u] = {p: p, b: 0, role: 'admin', inv: []};
            cur = u;
            document.getElementById('auth-box').style.display = 'none';
            update();
            return;
        }

        // Логика обычного игрока
        if(!db[u]) {
            db[u] = {p: p, b: 0, role: 'user', inv: []};
            addLog(`Регистрация: ${u}`);
        }

        if(db[u].p === p) {
            cur = u;
            document.getElementById('auth-box').style.display = 'none';
            update();
        } else {
            document.getElementById('error-msg').innerText = "Неверный пароль!";
        }
    }

    function update() {
        if(!cur) return;
        const uData = db[cur];
        document.getElementById('me').innerText = cur.toUpperCase();
        document.getElementById('myb').innerText = uData.b;
        document.getElementById('role-text').innerText = uData.role === 'admin' ? 'АДМИНИСТРАТОР' : 'ИГРОК';
        document.getElementById('role-text').style.color = uData.role === 'admin' ? '#c0392b' : '#5c7e10';

        // Видимость админки
        document.getElementById('admin-ui').style.display = uData.role === 'admin' ? 'block' : 'none';

        if(uData.role === 'admin') {
            const sel = document.getElementById('user-list');
            sel.innerHTML = '';
            Object.keys(db).forEach(name => {
                sel.innerHTML += `<option value="${name}">${name} [${db[name].role}] - ${db[name].b}₽</option>`;
            });
            document.getElementById('log-box').innerHTML = logs.map(l => `<div>${l}</div>`).join('');
        }
    }

    // АДМИН-ФУНКЦИИ
    function setBal() {
        const target = document.getElementById('user-list').value;
        const val = parseInt(document.getElementById('new-bal').value);
        if(isNaN(val)) return;
        db[target].b = val;
        addLog(`Админ ${cur} изменил баланс ${target} на ${val}₽`);
        save();
    }

    function setRole(role) {
        const target = document.getElementById('user-list').value;
        if(target === ROOT_ADMIN.login) return alert("Себя нельзя понизить!");
        db[target].role = role;
        addLog(`Админ ${cur} сменил роль ${target} на ${role}`);
        save();
    }

    function delUser() {
        const target = document.getElementById('user-list').value;
        if(target === cur) return alert("Нельзя удалить самого себя!");
        if(confirm(`Удалить ${target}?`)) {
            delete db[target];
            addLog(`Админ ${cur} УДАЛИЛ аккаунт ${target}`);
            save();
        }
    }

    function buy(price, name) {
        if(db[cur].b >= price) {
            db[cur].b -= price;
            db[cur].inv.push(name);
            addLog(`Игрок ${cur} купил ${name}`);
            save();
            alert("Покупка совершена!");
        } else alert("Недостаточно средств!");
    }
</script>
</body>
</html>
