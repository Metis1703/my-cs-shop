<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CS 1.6 MARKET — CHAT & AVATARS</title>
    <style>
        :root { --primary: #5c7e10; --bg: #0b0b0b; --panel: #161616; --text: #d1d1d1; --gold: #ffcc00; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; }

        /* Аватарки */
        .ava-mini { width: 35px; height: 35px; border-radius: 50%; border: 2px solid var(--primary); object-fit: cover; }
        .ava-chat { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--primary); object-fit: cover; margin-right: 10px; }
        .ava-profile { width: 100px; height: 100px; border-radius: 10px; border: 3px solid var(--primary); object-fit: cover; }

        #auth-screen { position: fixed; inset: 0; background: #000; z-index: 10000; display: flex; justify-content: center; align-items: center; }
        .auth-box { background: var(--panel); padding: 30px; border: 2px solid var(--primary); width: 320px; text-align: center; border-radius: 12px; }
        input, textarea { width: 100%; padding: 10px; margin: 8px 0; background: #111; border: 1px solid #333; color: #fff; border-radius: 5px; box-sizing: border-box; }
        
        header { background: #000; padding: 10px 5%; border-bottom: 2px solid var(--primary); display: none; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .nav-btn { background: var(--primary); color: #fff; border: none; padding: 8px 15px; cursor: pointer; font-weight: bold; border-radius: 4px; }

        .container { max-width: 1100px; margin: 0 auto; padding: 20px; display: none; grid-template-columns: 1fr 350px; gap: 20px; }
        .active-page { display: grid !important; }
        .card { background: var(--panel); padding: 20px; border-radius: 10px; border: 1px solid #333; margin-bottom: 20px; }

        /* ЧАТ */
        .chat-container { background: var(--panel); border: 1px solid #333; border-radius: 10px; display: flex; flex-direction: column; height: 500px; position: sticky; top: 80px; }
        #chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .chat-msg { display: flex; align-items: flex-start; animation: fadeIn 0.3s; }
        .msg-body { background: #222; padding: 8px 12px; border-radius: 8px; font-size: 14px; position: relative; }
        .msg-user { color: var(--primary); font-weight: bold; font-size: 12px; margin-bottom: 2px; }
        .msg-time { font-size: 10px; color: #555; position: absolute; right: 5px; bottom: 2px; }
        .chat-input-area { padding: 10px; border-top: 1px solid #333; display: flex; gap: 5px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="auth-box">
        <h2 style="color: var(--primary);">CS-MARKET</h2>
        <input type="text" id="u-login" placeholder="Логин">
        <input type="password" id="u-pass" placeholder="Пароль">
        <button class="nav-btn" style="width: 100%; margin-top: 10px;" onclick="handleAuth('login')">ВОЙТИ</button>
        <button class="nav-btn" style="width: 100%; background: #333; margin-top: 5px;" onclick="handleAuth('reg')">РЕГИСТРАЦИЯ</button>
    </div>
</div>

<header id="header">
    <div style="display: flex; align-items: center; gap: 12px;">
        <img id="h-ava" class="ava-mini" src="">
        <div style="font-weight: bold;"><span id="h-name"></span> | <span id="h-bal" style="color:var(--primary)">0</span> ₽</div>
    </div>
    <div style="display: flex; gap: 8px;">
        <button class="nav-btn" onclick="openPage('shop')">МАРКЕТ</button>
        <button class="nav-btn" onclick="openPage('profile')">КАБИНЕТ</button>
        <button class="nav-btn" style="background:#cc2e2e" onclick="logout()">ВЫХОД</button>
    </div>
</header>

<div class="container active-page" id="main-content">
    <!-- Левая колонка: Контент -->
    <div id="pages">
        <div id="shop-page" class="card">
            <h2>🛒 Магазин плагинов</h2>
            <div style="background:#111; padding:15px; border-radius:8px; border-left:4px solid var(--primary);">
                <h3>Army Ranks Ultimate</h3>
                <p>Баланс: <b id="p-price">500</b> ₽</p>
                <button class="nav-btn" onclick="buy(500, 'Army Ranks')">КУПИТЬ</button>
            </div>
        </div>

        <div id="profile-page" class="card" style="display:none">
            <h2>Личный кабинет</h2>
            <div style="display:flex; gap:20px; align-items:center">
                <div style="text-align:center">
                    <img id="p-ava-display" class="ava-profile" src="">
                    <label class="nav-btn" style="display:block; margin-top:5px; font-size:10px; cursor:pointer">
                        ФОТО <input type="file" id="ava-input" style="display:none" accept="image/*">
                    </label>
                </div>
                <div>
                    <h3 id="p-user-name"></h3>
                    <button class="nav-btn" onclick="addMoney()">ПОПОЛНИТЬ (+100)</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Правая колонка: Чат -->
    <div class="chat-container">
        <div style="padding:10px; border-bottom:1px solid #333; font-weight:bold; color:var(--primary)">ОБЩИЙ ЧАТ</div>
        <div id="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Напишите сообщение..." onkeypress="if(event.key==='Enter') sendChat()">
            <button class="nav-btn" onclick="sendChat()">➡</button>
        </div>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('cs_chat_db')) || {};
    let chat = JSON.parse(localStorage.getItem('cs_global_chat')) || [];
    let cur = sessionStorage.getItem('active_user') || null;
    const defAva = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyCAYAAAAeP4ixAAAAS0lEQVR42u3PAQ0AAAgCQOzf9NfwayYmIK9NA0B0R0R0R0R0R0R0R0R0R0R0R0R0R0R0R0R0R0R0R0R0R0R0R0R0R0R0R0R0R0R0R0R0R/WWAEaWIAEAAAAASUVORK5CYII=";

    window.onload = () => { if(cur && db[cur]) startSite(); };

    function handleAuth(type) {
        const u = document.getElementById('u-login').value.trim().toLowerCase();
        const p = document.getElementById('u-pass').value;
        if(!u || !p) return;
        if(type === 'reg') {
            if(db[u]) return alert("Занят!");
            db[u] = { pass: p, bal: 0, ava: defAva };
            localStorage.setItem('cs_chat_db', JSON.stringify(db));
            alert("ОК! Войдите.");
        } else {
            if(db[u] && db[u].pass === p) {
                cur = u; sessionStorage.setItem('active_user', u); startSite();
            } else alert("Ошибка!");
        }
    }

    function startSite() {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('header').style.display = 'flex';
        document.getElementById('main-content').style.display = 'grid';
        updateUI();
        renderChat();
    }

    function logout() { sessionStorage.removeItem('active_user'); location.reload(); }

    function updateUI() {
        const uData = db[cur];
        document.getElementById('h-name').innerText = cur.toUpperCase();
        document.getElementById('h-bal').innerText = uData.bal;
        document.getElementById('h-ava').src = uData.ava;
        document.getElementById('p-ava-display').src = uData.ava;
        document.getElementById('p-user-name').innerText = cur.toUpperCase();
        localStorage.setItem('cs_chat_db', JSON.stringify(db));
    }

    // ЛОГИКА ЧАТА
    function sendChat() {
        const input = document.getElementById('chat-input');
        if(!input.value.trim()) return;
        const msg = {
            user: cur,
            text: input.value.trim(),
            ava: db[cur].ava,
            time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
        };
        chat.push(msg);
        if(chat.length > 50) chat.shift();
        localStorage.setItem('cs_global_chat', JSON.stringify(chat));
        input.value = '';
        renderChat();
    }

    function renderChat() {
        const container = document.getElementById('chat-messages');
        container.innerHTML = chat.map(m => `
            <div class="chat-msg">
                <img src="${m.ava}" class="ava-chat">
                <div class="msg-body">
                    <div class="msg-user">${m.user}</div>
                    <div>${m.text}</div>
                    <span class="msg-time">${m.time}</span>
                </div>
            </div>
        `).join('');
        container.scrollTop = container.scrollHeight;
    }

    // АВАТАРКА
    document.getElementById('ava-input').onchange = function(e) {
        const reader = new FileReader();
        reader.onload = (ev) => { db[cur].ava = ev.target.result; updateUI(); renderChat(); };
        reader.readAsDataURL(e.target.files[0]);
    };

    function addMoney() { db[cur].bal += 100; updateUI(); }
    function openPage(p) {
        document.getElementById('shop-page').style.display = p === 'shop' ? 'block' : 'none';
        document.getElementById('profile-page').style.display = p === 'profile' ? 'block' : 'none';
    }
</script>
</body>
</html>
