<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Бесплатный Маркет CS 1.6</title>
    <style>
        body { background: #0f0f0f; color: #eee; font-family: 'Tahoma', sans-serif; margin: 0; text-align: center; }
        .header { background: #222; padding: 50px; border-bottom: 2px solid #00ff00; }
        .header h1 { color: #00ff00; margin: 0; text-transform: uppercase; }
        .container { display: flex; flex-wrap: wrap; justify-content: center; padding: 20px; }
        .product { background: #1a1a1a; border: 1px solid #333; margin: 15px; width: 280px; padding: 20px; border-radius: 10px; transition: 0.3s; }
        .product:hover { border-color: #00ff00; transform: scale(1.03); }
        .product img { width: 100%; border-radius: 5px; margin-bottom: 15px; }
        .price { font-size: 24px; color: #00ff00; font-weight: bold; margin: 15px 0; }
        .buy-btn { background: #00ff00; color: #000; padding: 12px 25px; border-radius: 5px; text-decoration: none; font-weight: bold; display: block; }
    </style>
</head>
<body>
    <div class="header">
        <h1>CS 1.6 FREE MARKET</h1>
        <p>Плагины / Модели / Готовые сервера</p>
    </div>
    <div class="container">
        <!-- ТОВАР 1 -->
        <div class="product">
            <img src="https://placehold.co" alt="Plugin">
            <h3>Супер Админ Меню</h3>
            <p>Гибкая настройка прав и оружия.</p>
            <div class="price">Бесплатно</div>
            <a href="https://t.me" class="buy-btn">СКАЧАТЬ / КУПИТЬ</a>
        </div>
        <!-- ТОВАР 2 -->
        <div class="product">
            <img src="https://placehold.co" alt="Model">
            <h3>Скин Террориста HD</h3>
            <p>Высокая детализация, без лагов.</p>
            <div class="price">100 руб.</div>
            <a href="https://t.me" class="buy-btn">СВЯЗАТЬСЯ</a>
        </div>
    </div>
</body>
</html>
