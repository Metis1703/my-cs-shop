<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CYBER MARKET — FINAL SYSTEM</title>
    <style>
        :root { 
            --neon-blue: #00f2ff; --neon-purple: #bc13fe; --neon-pink: #ff00de;
            --neon-gold: #ffcc00; --neon-green: #39ff14; --bg: #050505; --panel: rgba(15, 15, 20, 0.95); 
        }
        body { 
            background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden;
            background-image: radial-gradient(circle at 20% 30%, rgba(188, 19, 254, 0.1) 0%, transparent 40%);
        }
        header { background: rgba(0, 0, 0, 0.9); padding: 15px 5%; border-bottom: 2px solid var(--neon-purple); display: none; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 0 20px var(--neon-purple); }
        .nav-btn { background: transparent; color: var(--neon-blue); border: 1px solid var(--neon-blue); padding: 8px 16px; cursor: pointer; font-weight: bold; border-radius: 4px; text-transform: uppercase; font-size: 10px; transition: 0.3s; margin: 2px; outline: none; }
        .nav-btn:hover { background: var(--neon-blue); color: #000; box-shadow: 0 0 20px var(--neon-blue); }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; display: none; grid-template-columns: 1fr 350px; gap: 25px; }
        .card { background: var(--panel); padding: 20px; border-radius: 15px; border: 1px solid rgba(0, 242, 255, 0.2); margin-bottom: 20px; }
        
        /* АВАТАРКИ */
        .avatar-gallery { display: flex; flex-wrap: wrap; gap: 10px; margin: 15px 0; }
        .ava-option { width: 55px; height: 55px; border: 2px solid #333; border-radius: 50%; cursor: pointer; transition: 0.3s; object-fit: cover; background: #000; }
        .ava-active { border-color: var(--neon-blue) !important; box-shadow: 0 0 15px var(--neon-blue); transform: scale(1.1); }

        /* ЦВЕТА */
        .color-picker { display: flex; gap: 10px; margin: 10px 0; }
        .color-opt { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
        .color-active { border-color: #fff !important; transform: scale(1.2); }

        .friend-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.02); border-radius: 8px; margin-bottom: 5px; }
        #chat-box { height: 350px; overflow-y: auto; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 10px; font-size: 13px; border: 1px solid rgba(255,255,255,0.1); }
        #auth-screen { position: fixed; inset: 0; background: #000; z-index: 10000; display: flex; justify-content: center; align-items: center; }
        .auth-box { background: #0a0a0a; padding: 40px; border-radius: 20px; border: 2px solid var(--neon-blue); width: 320px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: rgba(255,255,255,0.05); border: 1px solid var(--neon-purple); border-radius: 5px; color: #fff; outline: none; box-sizing: border-box; }
        .market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="auth-box">
        <h1 style="color:var(--neon-blue); margin:0 0 20px 0;">CYBER_SYS</h1>
        <input type="text" id="u-login" placeholder="ЛОГИН">
        <input type="password" id="u-pass" placeholder="ПАРОЛЬ">
        <button class="nav-btn" style="width:100%; padding:15px" onclick="handleAuth()">ВОЙТИ / СОЗДАТЬ</button>
    </div>
</div>

<header id="header">
    <div style="display:flex; align-items:center; gap:15px">
        <img id="h-ava-img" src="" style="width:45px; height:45px; border-radius:50%; border:2px solid var(--neon-blue);">
        <div><b id="h-name"></b><br><span id="h-bal" style="color:var(--neon-pink)">0</span> <small>₽</small></div>
    </div>
    <div style="display:flex; gap:10px">
        <button id="admin-btn" class="nav-btn" style="border-color:var(--neon-gold); color:var(--neon-gold); display:none" onclick="openPage('admin')">👑 ROOT</button>
        <button class="nav-btn" onclick="openPage('shop')">МАРКЕТ</button>
        <button class="nav-btn" style="border-color:var(--neon-pink); color:var(--neon-pink)" onclick="openPage('profile')">ПРОФИЛЬ</button>
        <button class="nav-btn" style="border-color:#ff3333; color:#ff3333" onclick="logout()">ВЫХОД</button>
    </div>
</header>

<div class="container" id="main-content">
    <div id="pages">
        <!-- ПРОФИЛЬ -->
        <div id="profile-page">
            <div class="card">
                <h3>👤 ВЫБОР АВАТАРА</h3>
                <div class="avatar-gallery" id="ava-list"></div>
            </div>
            <div class="card">
                <h3>🌈 ЦВЕТ ИДЕНТИФИКАТОРА</h3>
                <div class="color-picker" id="color-list"></div>
            </div>
            <div class="card">
                <h3>👥 ДРУЗЬЯ (<span id="p-friend-count">0</span>)</h3>
                <div style="display:flex; gap:10px">
                    <input type="text" id="f-search" placeholder="Точный ник друга...">
                    <button class="nav-btn" onclick="addFriend()">ДОБАВИТЬ</button>
                </div>
                <div id="f-list" style="margin-top:15px"></div>
            </div>
            <div class="card">Баланс: <b id="p-bal">0</b> ₽ <button class="nav-btn" onclick="addMoney()">+100</button></div>
        </div>

        <!-- МАРКЕТ -->
        <div id="shop-page" style="display:none">
            <div class="card"><h3>🛒 МАРКЕТ</h3><div id="m-list" class="market-grid"></div></div>
        </div>

        <!-- АДМИНКА -->
        <div id="admin-page" style="display:none">
            <div class="card">
                <h3>👑 ROOT PANEL</h3>
                <input type="text" id="adm-item-n" placeholder="Название товара">
                <input type="number" id="adm-item-p" placeholder="Цена">
                <input type="text" id="adm-item-i" placeholder="Иконка (Emoji)">
                <button class="nav-btn" style="width:100%" onclick="createItem()">ДОБАВИТЬ ТОВАР</button>
                <hr style="margin:20px 0; opacity:0.1">
                <div id="adm-users"></div>
            </div>
        </div>
    </div>

    <!-- БОКОВАЯ ПАНЕЛЬ: ЧАТ -->
    <div class="sidebar">
        <div class="card">
            <h4>💬 ОБЩИЙ КАНАЛ</h4>
            <div id="chat-box"></div>
            <input type="text" id="chat-in" placeholder="Сообщение..." onkeypress="if(event.key==='Enter') sendChat()">
        </div>
    </div>
</div>

<script>
    const ADMIN = "admin";
    const AVAS = [
        "https://api.dicebear.com", "https://api.dicebear.com",
        "https://api.dicebear.com", "https://api.dicebear.com",
        "https://api.dicebear.com", "https://api.dicebear.com"
    ];
    const COLORS = ["#00f2ff", "#ff00de", "#bc13fe", "#39ff14", "#ffcc00", "#ffffff"];

    let db = JSON.parse(localStorage.getItem('cyber_db')) || { users: {}, msgs: [], market: [] };
    let user = localStorage.getItem('cyber_user');

    function save() { localStorage.setItem('cyber_db', JSON.stringify(db)); }

    // АВТОРИЗАЦИЯ
    function handleAuth() {
        const log = document.getElementById('u-login').value.trim();
        const pass = btoa(document.getElementById('u-pass').value);
        if(!log) return;

        if(!db.users[log]) {
            db.users[log] = { pass: pass, bal: 500, ava: AVAS[0], color: COLORS[0], friends: [] };
        } else if(db.users[log].pass !== pass) {
            return alert("Ошибка доступа!");
        }

        user = log;
        localStorage.setItem('cyber_user', log);
        save();
        location.reload();
    }

    if(user && db.users[user]) {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('header').style.display = 'flex';
        document.getElementById('main-content').style.display = 'grid';
        if(user === ADMIN) document.getElementById('admin-btn').style.display = 'block';
        init();
    }

    function init() {
        renderAll();
        setInterval(renderChat, 2000);
    }

    function renderAll() {
        const uData = db.users[user];
        document.getElementById('h-name').innerText = user;
        document.getElementById('h-name').style.color = uData.color;
        document.getElementById('h-ava-img').src = uData.ava;
        document.getElementById('h-bal').innerText = uData.bal;
        document.getElementById('p-bal').innerText = uData.bal;
        document.getElementById('p-friend-count').innerText = uData.friends.length;

        // Рендер аватарок
        document.getElementById('ava-list').innerHTML = AVAS.map(a => `
            <img src="${a}" class="ava-option ${uData.ava === a ? 'ava-active' : ''}" onclick="setAva('${a}')">
        `).join('');

        // Рендер цветов
        document.getElementById('color-list').innerHTML = COLORS.map(c => `
            <div class="color-opt ${uData.color === c ? 'color-active' : ''}" style="background:${c}" onclick="setColor('${c}')"></div>
        `).join('');

        // Рендер друзей
        document.getElementById('f-list').innerHTML = uData.friends.map(f => `
            <div class="friend-row">
                <span style="color:${db.users[f]?.color || '#fff'}">${f}</span>
                <button class="nav-btn" style="color:red; border-color:red; padding:2px 8px;" onclick="remFriend('${f}')">✕</button>
            </div>
        `).join('');

        renderMarket();
        renderChat();
        if(user === ADMIN) renderAdmin();
    }

    // НАСТРОЙКИ ПРОФИЛЯ
    function setAva(url) { db.users[user].ava = url; save(); renderAll(); }
    function setColor(hex) { db.users[user].color = hex; save(); renderAll(); }
    function addMoney() { db.users[user].bal += 100; save(); renderAll(); }

    // ДРУЗЬЯ
    function addFriend() {
        const target = document.getElementById('f-search').value.trim();
        if(!db.users[target] || target === user) return alert("Пользователь не найден!");
        if(db.users[user].friends.includes(target)) return alert("Уже в друзьях!");
        db.users[user].friends.push(target);
        save(); renderAll();
        document.getElementById('f-search').value = "";
    }
    function remFriend(name) {
        db.users[user].friends = db.users[user].friends.filter(n => n !== name);
        save(); renderAll();
    }

    // МАРКЕТ
    function renderMarket() {
        document.getElementById('m-list').innerHTML = db.market.map(i => `
            <div class="card" style="text-align:center; margin:0;">
                <div style="font-size:30px">${i.icon}</div>
                <b>${i.name}</b><br><small>${i.price} ₽</small><br>
                <button class="nav-btn" style="width:100%; margin-top:10px" onclick="buy('${i.id}')">КУПИТЬ</button>
            </div>
        `).join('');
    }
    function buy(id) {
        const item = db.market.find(x => x.id == id);
        if(db.users[user].bal >= item.price) {
            db.users[user].bal -= item.price;
            save(); renderAll(); alert("Успешно куплено!");
        } else alert("Мало кредитов!");
    }

    // ЧАТ
    function sendChat() {
        const inp = document.getElementById('chat-in');
        if(!inp.value.trim()) return;
        db.msgs.push({ u: user, t: inp.value, c: db.users[user].color });
        if(db.msgs.length > 40) db.msgs.shift();
        save(); inp.value = ""; renderChat();
    }
    function renderChat() {
        const box = document.getElementById('chat-box');
        box.innerHTML = db.msgs.map(m => `<div><b style="color:${m.c}">${m.u}:</b> ${m.t}</div>`).join('');
        box.scrollTop = box.scrollHeight;
    }

    // АДМИНКА
    function createItem() {
        const n = document.getElementById('adm-item-n').value, p = document.getElementById('adm-item-p').value, i = document.getElementById('adm-item-i').value;
        if(!n || !p) return;
        db.market.push({ id: Date.now(), name: n, price: parseInt(p), icon: i || "📦" });
        save(); renderAll();
    }
    function renderAdmin() {
        document.getElementById('adm-users').innerHTML = "<h4>ЮЗЕРЫ:</h4>" + Object.keys(db.users).map(name => `
            <div class="friend-row">
                <span>${name} (${db.users[name].bal}₽)</span>
                <button onclick="db.users['${name}'].bal+=1000;save();renderAll();" class="nav-btn">+1k</button>
            </div>
        `).join('');
    }

    function openPage(id) {
        const p = ["profile-page", "shop-page", "admin-page"];
        p.forEach(x => document.getElementById(x).style.display = (x.startsWith(id)) ? 'block' : 'none');
    }

    function logout() { localStorage.removeItem('cyber_user'); location.reload(); }
</script>

</body>
</html>
