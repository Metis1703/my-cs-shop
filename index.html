<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CS 1.6 ULTIMATE MONOLITH SHOP</title>
    <style>
        :root { --primary: #5c7e10; --bg: #0b0b0b; --panel: #161616; --text: #d1d1d1; --gold: #ffcc00; --blue: #3498db; --red: #e74c3c; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }
        
        /* Fireworks Canvas */
        #fw-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 9999; }

        /* Auth Screen */
        #auth-screen { position: fixed; inset: 0; background: #000; z-index: 10000; display: flex; justify-content: center; align-items: center; }
        .auth-box { background: var(--panel); padding: 30px; border-radius: 12px; border: 2px solid var(--primary); width: 340px; text-align: center; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #111; border: 1px solid #333; color: #fff; box-sizing: border-box; border-radius: 4px; }
        .captcha-box { background: #000; padding: 10px; margin: 10px 0; border: 1px dashed var(--primary); font-weight: bold; letter-spacing: 3px; }

        /* Header */
        header { background: #000; padding: 10px 5%; border-bottom: 2px solid var(--primary); display: none; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .nav-btn { background: var(--primary); color: #fff; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 4px; transition: 0.3s; }
        .nav-btn:hover { background: #76a014; transform: translateY(-2px); }
        .nav-btn:disabled { background: #333; cursor: not-allowed; }

        /* Layout */
        .container { max-width: 1100px; margin: 0 auto; padding: 30px 20px; display: none; }
        .active-page { display: block !important; }
        .card { background: var(--panel); padding: 20px; border-radius: 10px; border: 1px solid #333; margin-bottom: 20px; }

        /* Roulette */
        .roulette-wrapper { position: relative; width: 100%; height: 120px; background: #111; border: 2px solid var(--primary); overflow: hidden; border-radius: 8px; margin: 20px 0; }
        .pointer { position: absolute; top: 0; left: 50%; width: 4px; height: 100%; background: var(--red); z-index: 10; transform: translateX(-50%); box-shadow: 0 0 15px var(--red); }
        .tape { display: flex; position: absolute; top: 10px; left: 0; will-change: transform; }
        .prize-node { min-width: 120px; height: 100px; margin: 0 5px; background: #222; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #333; border-radius: 5px; }

        /* Admin */
        #admin-ui { border: 2px solid var(--red); background: #110808; display: none; }
        .admin-title { color: var(--red); font-weight: bold; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; display: flex; justify-content: space-between; }

        /* Helpers */
        .avatar-img { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--primary); object-fit: cover; }
        .old-price { text-decoration: line-through; color: #666; font-size: 14px; margin-right: 10px; }
        .new-price { color: #fff; font-size: 22px; font-weight: bold; }
        .log-list { background: #000; padding: 10px; height: 150px; overflow-y: auto; font-size: 12px; font-family: monospace; border: 1px solid #333; }
        .log-entry { border-bottom: 1px solid #222; padding: 4px 0; }
    </style>
</head>
<body>

<canvas id="fw-canvas"></canvas>

<!-- ЭКРАН ВХОДА -->
<div id="auth-screen">
    <div class="auth-box">
        <h2 style="color: var(--primary);">CS-MARKET</h2>
        <input type="text" id="u-login" placeholder="Логин">
        <input type="password" id="u-pass" placeholder="Пароль">
        
        <div id="cap-box" style="display:none">
            <div id="cap-q" class="captcha-box"></div>
            <input type="number" id="cap-a" placeholder="Ответ">
        </div>

        <button class="nav-btn" style="width: 100%; margin-top: 10px;" onclick="handleAuth('login')">ВОЙТИ</button>
        <button class="nav-btn" style="width: 100%; background: #333; margin-top: 5px;" onclick="showReg()">РЕГИСТРАЦИЯ</button>
    </div>
</div>

<!-- ШАПКА -->
<header id="header">
    <div style="display: flex; align-items: center; gap: 15px;">
        <img id="h-ava" class="avatar-img" src="">
        <div>
            <div style="font-weight: bold;"><span id="h-name"></span> <span id="h-disc" style="color:var(--gold); font-size: 12px;"></span></div>
            <div style="font-size: 12px; color: var(--primary);">Баланс: <span id="h-bal">0</span> ₽</div>
        </div>
    </div>
    <div style="display: flex; gap: 10px;">
        <button class="nav-btn" onclick="openPage('shop')">МАРКЕТ</button>
        <button class="nav-btn" onclick="openPage('cases')">КЕЙСЫ</button>
        <button class="nav-btn" onclick="openPage('profile')">КАБИНЕТ</button>
        <button id="admin-entry-btn" class="nav-btn" style="background:var(--red); display:none;" onclick="openAdmin()">АДМИНКА</button>
        <button class="nav-btn" style="background:#444" onclick="location.reload()">ВЫХОД</button>
    </div>
</header>

<!-- СТРАНИЦЫ -->
<div class="container active-page" id="shop">
    <h2>🎯 Магазин плагинов</h2>
    <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px;">
        <div class="card">
            <h3>Army Ranks Ultimate</h3>
            <div id="price-1"><span class="old-price"></span><span class="new-price">500 ₽</span></div>
            <button class="nav-btn" style="width:100%; margin-top:15px;" onclick="buy(500, 'Army Ranks')">КУПИТЬ</button>
        </div>
        <div class="card">
            <h3>VIP Menu Custom</h3>
            <div id="price-2"><span class="old-price"></span><span class="new-price">1200 ₽</span></div>
            <button class="nav-btn" style="width:100%; margin-top:15px;" onclick="buy(1200, 'VIP Menu')">КУПИТЬ</button>
        </div>
    </div>
</div>

<div class="container" id="cases">
    <div class="card" style="text-align: center;">
        <h2>🎰 Рулетка удачи</h2>
        <div class="roulette-wrapper">
            <div class="pointer"></div>
            <div id="tape" class="tape"></div>
        </div>
        <button class="nav-btn" id="spin-btn" style="padding: 15px 50px;" onclick="spin()">КРУТИТЬ</button>
        <div id="live-wins" class="log-list" style="margin-top:20px; text-align: left;"></div>
    </div>
</div>

<div class="container" id="profile">
    <div class="card" style="display: flex; gap: 20px; align-items: center;">
        <div style="text-align: center;">
            <img id="p-ava" src="" style="width: 100px; height: 100px; border-radius: 10px; border: 2px solid var(--primary); object-fit: cover;">
            <input type="file" id="ava-in" style="display:none" accept="image/*">
            <button class="nav-btn" style="font-size: 10px; padding: 5px; width: 100px; margin-top: 5px;" onclick="document.getElementById('ava-in').click()">СМЕНИТЬ</button>
        </div>
        <div style="flex:1">
            <h2 id="p-user">User</h2>
            <p>Статус: <b id="p-rank" style="color:var(--gold)">Новичок</b></p>
            <div style="display: flex; gap: 10px;">
                <div class="card" style="flex:1; padding:10px; text-align:center; margin:0;">Потрачено:<br><b id="p-spent">0</b> ₽</div>
                <div class="card" style="flex:1; padding:10px; text-align:center; margin:0;">Задоначено:<br><b id="p-total">0</b> ₽</div>
            </div>
        </div>
    </div>
    <div class="card">
        <h3>💳 Пополнение баланса (AnyPay)</h3>
        <input type="number" id="pay-amt" value="100" style="width:100px">
        <button class="nav-btn" onclick="deposit()">ПОПОЛНИТЬ</button>
    </div>
    <div class="card">
        <h3>🎁 Активация промокода</h3>
        <input type="text" id="promo-in" placeholder="Введите код">
        <button class="nav-btn" onclick="activatePromo()">ОК</button>
    </div>
</div>

<!-- АДМИН ПАНЕЛЬ -->
<div class="container" id="admin-ui">
    <div class="admin-title">
        <span>🛠 АДМИН-ЦЕНТР</span>
        <button class="nav-btn" style="background:#333" onclick="openPage('shop')">ВЕРНУТЬСЯ НА САЙТ</button>
    </div>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
        <div class="card" style="background:#000">
            <h4>Баланс и Роли</h4>
            <select id="adm-user-list"></select>
            <input type="number" id="adm-new-bal" placeholder="Новый баланс">
            <button class="nav-btn" style="width:100%" onclick="admSetBal()">УСТАНОВИТЬ</button>
            <button class="nav-btn" style="width:100%; background:var(--blue); margin-top:5px" onclick="admMakeAdmin()">ДАТЬ АДМИНКУ</button>
            <button class="nav-btn" style="width:100%; background:var(--red); margin-top:5px" onclick="admDeleteUser()">УДАЛИТЬ ИГРОКА</button>
        </div>
        <div class="card" style="background:#000">
            <h4>Промокоды</h4>
            <input type="text" id="adm-promo-name" placeholder="Код (напр. START)">
            <input type="number" id="adm-promo-val" placeholder="Сумма (₽)">
            <button class="nav-btn" style="width:100%; background:var(--gold); color:#000" onclick="admCreatePromo()">СОЗДАТЬ</button>
        </div>
    </div>
    <div class="log-list" id="adm-logs"></div>
</div>

<script>
    // --- DATABASE ---
    const ADMIN_ROOT = { login: "admin", pass: "777" };
    let db = JSON.parse(localStorage.getItem('cs_mega_db')) || {};
    let promos = JSON.parse(localStorage.getItem('cs_mega_promos')) || {};
    let logs = JSON.parse(localStorage.getItem('cs_mega_logs')) || [];
    let cur = null;
    let capRes = 0;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // --- AUTH ---
    function showReg() {
        const a = Math.floor(Math.random()*10), b = Math.floor(Math.random()*10);
        capRes = a + b;
        document.getElementById('cap-q').innerText = `АНТИ-БОТ: ${a} + ${b} = ?`;
        document.getElementById('cap-box').style.display = 'block';
    }

    function handleAuth(type) {
        const u = document.getElementById('u-login').value.trim().toLowerCase();
        const p = document.getElementById('u-pass').value;
        const ans = document.getElementById('cap-a').value;
        if(!u || !p) return alert("Заполни поля!");

        if(type === 'reg') {
            if(db[u]) return alert("Логин занят!");
            if(parseInt(ans) !== capRes) return alert("Капча неверна!");
            db[u] = { pass: p, bal: 0, spent: 0, total_in: 0, role: 'user', inv: [], ava: "https://i.imgur.com", coupon: 0, used: [] };
            addLog(`Регистрация: ${u}`);
            alert("Успешно! Теперь войдите.");
            location.reload();
        } else {
            if(u === ADMIN_ROOT.login && p === ADMIN_ROOT.pass) {
                if(!db[u]) db[u] = { pass: p, bal: 0, spent: 0, total_in: 0, role: 'admin', inv: [], ava: "https://i.imgur.com", coupon: 0, used: [] };
                cur = u; start();
            } else if(db[u] && db[u].pass === p) {
                cur = u; start();
            } else alert("Ошибка входа!");
        }
    }

    function start() {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('header').style.display = 'flex';
        update();
        setInterval(() => { addHistory("Player_" + Math.floor(Math.random()*999), "10 ₽", "money"); }, 20000);
    }

    function update() {
        const u = db[cur];
        const loyalty = u.spent >= 3000 ? 10 : (u.spent >= 1000 ? 5 : 0);
        const totalDisc = loyalty + (u.coupon || 0);

        document.getElementById('h-name').innerText = cur.toUpperCase();
        document.getElementById('h-bal').innerText = Math.floor(u.bal);
        document.getElementById('h-disc').innerText = totalDisc > 0 ? `(-${totalDisc}%)` : "";
        document.getElementById('h-ava').src = u.ava;
        document.getElementById('p-ava').src = u.ava;
        document.getElementById('p-user').innerText = cur.toUpperCase();
        document.getElementById('p-spent').innerText = Math.floor(u.spent);
        document.getElementById('p-total').innerText = Math.floor(u.total_in);
        document.getElementById('p-rank').innerText = loyalty === 10 ? "VIP" : (loyalty === 5 ? "Постоянный" : "Новичок");
        
        if(u.role === 'admin') document.getElementById('admin-entry-btn').style.display = 'block';

        // Prices
        [,].forEach(([pr, id]) => {
            const final = Math.floor(pr * (1 - totalDisc/100));
            document.getElementById(`price-${id}`).innerHTML = `<span class="old-price">${totalDisc>0?pr+'₽':''}</span><span class="new-price">${final}₽</span>`;
        });

        const sel = document.getElementById('adm-user-list');
        sel.innerHTML = Object.keys(db).map(n => `<option value="${n}">${n} [${db[n].role}] (${db[n].bal}₽)</option>`).join('');
        document.getElementById('adm-logs').innerHTML = logs.map(l => `<div class="log-entry">${l}</div>`).join('');
        
        save();
    }

    // --- SYSTEMS ---
    function deposit() {
        const amt = parseInt(document.getElementById('pay-amt').value);
        if(amt < 10) return alert("Мин. 10 ₽");
        db[cur].bal += amt; db[cur].total_in += amt;
        addLog(`Пополнение: +${amt}₽`); update();
    }

    function activatePromo() {
        const code = document.getElementById('promo-in').value.trim().toUpperCase();
        if(!promos[code]) return alert("Нет такого кода!");
        if(db[cur].used.includes(code)) return alert("Уже использован!");
        db[cur].bal += promos[code];
        db[cur].used.push(code);
        addLog(`Активирован промокод ${code}: +${promos[code]}₽`);
        update();
    }

    function buy(base, name) {
        const disc = (db[cur].spent >= 3000 ? 10 : (db[cur].spent >= 1000 ? 5 : 0)) + db[cur].coupon;
        const price = base * (1 - disc/100);
        if(db[cur].bal >= price) {
            db[cur].bal -= price; db[cur].spent += price;
            db[cur].inv.push(name); db[cur].coupon = 0;
            addLog(`Покупка: ${name} за ${Math.floor(price)}₽`); update();
            alert("Куплено!");
        } else alert("Недостаточно средств!");
    }

    // --- ROULETTE ---
    const pool = [{n: "10 ₽", t:"money"}, {n: "50 ₽", t:"money"}, {n: "10%", t:"coupon"}, {n: "30%", t:"coupon"}];
    function spin() {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const tape = document.getElementById('tape');
        const btn = document.getElementById('spin-btn');
        btn.disabled = true;
        tape.innerHTML = '';
        for(let i=0; i<80; i++) {
            const p = pool[Math.floor(Math.random()*pool.length)];
            const div = document.createElement('div');
            div.className = 'prize-node';
            div.innerHTML = `<b style="color:${p.t==='money'?'var(--gold)':'var(--blue)'}">${p.n}</b>`;
            tape.appendChild(div);
        }
        tape.style.transition = 'none'; tape.style.transform = 'translateX(0)';
        setTimeout(() => {
            const winIdx = 65 + Math.floor(Math.random()*5);
            const winVal = tape.children[winIdx].querySelector('b').innerText;
            const offset = (winIdx * 130) - (300 - 65);
            tape.style.transition = 'transform 4s cubic-bezier(0.1, 0, 0.1, 1)';
            tape.style.transform = `translateX(-${offset}px)`;
            let lastTick = 0;
            const tick = setInterval(() => {
                const curX = Math.abs(new WebKitCSSMatrix(window.getComputedStyle(tape).transform).m41);
                if(Math.floor(curX/130) !== lastTick) { playSfx(); lastTick = Math.floor(curX/130); }
            }, 50);
            setTimeout(() => {
                clearInterval(tick);
                if(winVal.includes('%')) db[cur].coupon = parseInt(winVal); else db[cur].bal += parseInt(winVal);
                if(winVal === "30%") launchFW();
                addHistory(cur, winVal, winVal.includes('%') ? 'coupon' : 'money');
                addLog(`Кейс: выигран ${winVal}`); update();
                btn.disabled = false;
            }, 4200);
        }, 50);
    }

    function playSfx() {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.frequency.value = 400; g.gain.value = 0.05;
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + 0.1);
    }

    // --- ADMIN ---
    function openAdmin() { openPage('admin-ui'); }
    function admSetBal() {
        const t = document.getElementById('adm-user-list').value;
        const v = parseInt(document.getElementById('adm-new-bal').value);
        db[t].bal = v; addLog(`Админ ${cur} изменил баланс ${t} на ${v}₽`); update();
    }
    function admMakeAdmin() {
        const t = document.getElementById('adm-user-list').value;
        if(prompt("Пароль 777:") !== "777") return;
        db[t].role = 'admin'; addLog(`Админ ${cur} назначил ${t} администратором`); update();
    }
    function admDeleteUser() {
        const t = document.getElementById('adm-user-list').value;
        if(t === cur || prompt("777:") !== "777") return;
        delete db[t]; addLog(`Админ ${cur} УДАЛИЛ ${t}`); update();
    }
    function admCreatePromo() {
        const n = document.getElementById('adm-promo-name').value.toUpperCase();
        const v = parseInt(document.getElementById('adm-promo-val').value);
        promos[n] = v; addLog(`Создан промокод ${n} на ${v}₽`); update();
    }

    // --- HELPERS ---
    function openPage(id) { document.querySelectorAll('.container').forEach(c => c.classList.remove('active-page')); document.getElementById(id).classList.add('active-page'); }
    function addLog(m) { logs.unshift(`[${new Date().toLocaleTimeString()}] ${m}`); if(logs.length > 50) logs.pop(); }
    function addHistory(u, v, t) {
        const div = document.createElement('div');
        div.innerHTML = `<span style="color:#666">${new Date().toLocaleTimeString()}</span> Игрок <b>${u}</b> выбил <b style="color:${t==='money'?'var(--gold)':'var(--blue)'}">${v}</b>`;
        document.getElementById('live-wins').prepend(div);
        if(document.getElementById('live-wins').children.length > 10) document.getElementById('live-wins').lastChild.remove();
    }
    function save() { localStorage.setItem('cs_mega_db', JSON.stringify(db)); localStorage.setItem('cs_mega_promos', JSON.stringify(promos)); localStorage.setItem('cs_mega_logs', JSON.stringify(logs)); }
    document.getElementById('ava-in').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => { db[cur].ava = ev.target.result; update(); };
        reader.readAsDataURL(e.target.files);
    };

    // --- FW ---
    const fwCan = document.getElementById('fw-canvas'); const fctx = fwCan.getContext('2d');
    let fwP = [];
    function launchFW() {
        fwCan.width = window.innerWidth; fwCan.height = window.innerHeight;
        for(let i=0; i<50; i++) fwP.push({x:fwCan.width/2, y:fwCan.height/2, vx:Math.random()*10-5, vy:Math.random()*10-5, c:`hsl(${Math.random()*360},100%,50%)`, a:1});
        function d() {
            fctx.clearRect(0,0,fwCan.width,fwCan.height);
            fwP.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.a -= 0.01; fctx.globalAlpha = p.a; fctx.fillStyle = p.c; fctx.beginPath(); fctx.arc(p.x,p.y,3,0,7); fctx.fill(); });
            if(fwP.length && fwP[0].a > 0) requestAnimationFrame(d);
        } d();
    }
</script>
</body>
</html>
