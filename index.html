<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CYBER_HUB — METIS EDITION</title>
    <style>
        :root { 
            --neon-blue: #00f2ff; --neon-purple: #bc13fe; --neon-pink: #ff00de;
            --neon-gold: #ffcc00; --neon-green: #39ff14; --bg: #050505; --panel: rgba(15, 15, 20, 0.95); 
        }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }
        header { background: rgba(0,0,0,0.9); padding: 15px 5%; border-bottom: 2px solid var(--neon-purple); display: none; justify-content: space-between; align-items: center; position: sticky; top:0; z-index:100; }
        
        .nav-btn { background: transparent; color: var(--neon-blue); border: 1px solid var(--neon-blue); padding: 8px 16px; cursor: pointer; font-weight: bold; border-radius: 4px; text-transform: uppercase; font-size: 10px; transition: 0.3s; margin: 2px; }
        .nav-btn:hover { background: var(--neon-blue); color: #000; box-shadow: 0 0 15px var(--neon-blue); }
        
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; display: none; grid-template-columns: 1fr 350px; gap: 25px; }
        .card { background: var(--panel); padding: 20px; border-radius: 15px; border: 1px solid rgba(0, 242, 255, 0.2); margin-bottom: 20px; }
        
        input, select { width: 100%; padding: 10px; margin: 5px 0; background: rgba(255,255,255,0.05); border: 1px solid var(--neon-purple); border-radius: 5px; color: #fff; outline: none; box-sizing: border-box; }
        
        #auth-screen { position: fixed; inset: 0; background: #000; z-index: 10000; display: flex; justify-content: center; align-items: center; }
        .auth-box { background: #0a0a0a; padding: 35px; border-radius: 20px; border: 2px solid var(--neon-blue); width: 320px; text-align: center; }
        
        .badge { padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: bold; margin-left: 5px; color: #000; background: var(--neon-gold); }
        .user-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #222; }

        /* Эффект Глитча */
        .glitch {
            font-size: 20px; font-weight: bold; text-transform: uppercase; position: relative;
            color: var(--neon-pink); text-shadow: 0.05em 0 0 var(--neon-blue), -0.025em -0.05em 0 var(--neon-purple);
            animation: glitch-anim 600ms infinite; margin: 0 0 15px 0;
        }
        @keyframes glitch-anim {
            0% { text-shadow: 0.05em 0 0 var(--neon-blue), -0.05em -0.025em 0 var(--neon-purple); }
            50% { text-shadow: -0.05em -0.025em 0 var(--neon-blue), 0.05em 0.05em 0 var(--neon-gold); }
            100% { text-shadow: 0.025em 0.05em 0 var(--neon-blue), -0.05em 0 0 var(--neon-purple); }
        }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="auth-box">
        <h1 style="color:var(--neon-blue); margin-top:0">CYBER_HUB</h1>
        <input type="text" id="u-login" placeholder="ЛОГИН">
        <input type="password" id="u-pass" placeholder="ПАРОЛЬ">
        <button class="nav-btn" style="width:100%; padding:14px" onclick="auth()">ВОЙТИ / СОЗДАТЬ</button>
    </div>
</div>

<header id="header">
    <div style="display:flex; align-items:center; gap:12px">
        <img id="h-ava" src="" style="width:45px; height:45px; border-radius:50%; border:2px solid var(--neon-blue); object-fit:cover">
        <div><b id="h-name"></b><span id="h-badge"></span><br><span id="h-bal" style="color:var(--neon-pink)">0</span> ₽</div>
    </div>
    <div style="display:flex; gap:5px">
        <button id="admin-btn" class="nav-btn" style="border-color:var(--neon-gold); color:var(--neon-gold); display:none" onclick="openPage('admin')">👑 УПРАВЛЕНИЕ</button>
        <button class="nav-btn" onclick="openPage('shop')">МАРКЕТ</button>
        <button class="nav-btn" onclick="openPage('main')">ПРОФИЛЬ</button>
        <button class="nav-btn" style="border-color:red; color:red" onclick="logout()">ВЫХОД</button>
    </div>
</header>

<div class="container" id="main-content">
    <div id="pages">
        <!-- ГЛАВНАЯ / ПРОФИЛЬ -->
        <div id="page-main">
            <div class="card">
                <h3>🎒 ИНВЕНТАРЬ</h3>
                <div id="u-inv" style="display:grid; grid-template-columns:repeat(3, 1fr); gap:10px;"></div>
            </div>
        </div>
        
        <!-- МАГАЗИН -->
        <div id="page-shop" style="display:none">
            <div class="card">
                <h3 class="glitch">💀 BLACK MARKET</h3>
                <div id="m-list" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:15px;"></div>
            </div>
        </div>

        <!-- АДМИНКА -->
        <div id="page-admin" style="display:none">
            <div class="card">
                <h3>📦 ВЫСТАВИТЬ ТОВАР</h3>
                <input type="text" id="adm-n" placeholder="Имя товара">
                <input type="number" id="adm-p" placeholder="Цена">
                <input type="text" id="adm-link" placeholder="Ссылка на файл">
                <button class="nav-btn" style="width:100%" onclick="createItem()">ДОБАВИТЬ В МАРКЕТ</button>
            </div>
            <div class="card">
                <h3>👥 ПОЛЬЗОВАТЕЛИ</h3>
                <div id="adm-users"></div>
            </div>
        </div>
    </div>

    <!-- САЙДБАР С ЧАТОМ -->
    <div class="sidebar">
        <div class="card">
            <h4>💬 КАНАЛ СВЯЗИ</h4>
            <div id="chat" style="height:300px; overflow-y:auto; font-size:12px; margin-bottom:10px; border-bottom: 1px solid #222;"></div>
            <input type="text" id="chat-in" placeholder="Сказать..." onkeypress="if(event.key==='Enter') sendMsg()">
        </div>
    </div>
</div>

<script>
    const MY_LOGIN = "Metis"; 
    const MY_PASS = "1703"; 

    let db = JSON.parse(localStorage.getItem('CYBER_DATA_V1')) || { users: {}, msgs: [], market: [] };
    let user = localStorage.getItem('active_user');

    function save() { localStorage.setItem('CYBER_DATA_V1', JSON.stringify(db)); }

    function auth() {
        const l = document.getElementById('u-login').value.trim();
        const p = document.getElementById('u-pass').value;
        if(!l || !p) return;

        if(l === MY_LOGIN && p !== MY_PASS) return alert("ОШИБКА ДОСТУПА!");

        if(!db.users[l]) {
            db.users[l] = { pass: btoa(p), bal: 1000, inv: [], isOwner: (l === MY_LOGIN), ava: "https://api.dicebear.com"+l };
        } else if(atob(db.users[l].pass) !== p) {
            return alert("Неверный пароль!");
        }

        user = l; localStorage.setItem('active_user', l); save(); location.reload();
    }

    if(user && db.users[user]) {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('header').style.display = 'flex';
        document.getElementById('main-content').style.display = 'grid';
        if(user === MY_LOGIN) document.getElementById('admin-btn').style.display = 'block';
        init();
    }

    function init() {
        const u = db.users[user];
        document.getElementById('h-name').innerText = user;
        document.getElementById('h-bal').innerText = u.bal;
        document.getElementById('h-ava').src = u.ava;
        if(user === MY_LOGIN) document.getElementById('h-badge').innerHTML = '<span class="badge">OWNER</span>';
        renderInv(); renderMarket(); renderChat();
        if(user === MY_LOGIN) renderUsers();
    }

    function openPage(p) {
        document.getElementById('page-main').style.display = p === 'main' ? 'block' : 'none';
        document.getElementById('page-shop').style.display = p === 'shop' ? 'block' : 'none';
        document.getElementById('page-admin').style.display = p === 'admin' ? 'block' : 'none';
    }

    function renderInv() {
        const u = db.users[user];
        document.getElementById('u-inv').innerHTML = u.inv.length ? u.inv.map(i => `
            <div class="card" style="margin:0; padding:10px; font-size:11px; border-color:var(--neon-purple)">
                <b>${i.n}</b><br><a href="${i.link}" target="_blank" style="color:var(--neon-blue)">СКАЧАТЬ</a>
            </div>
        `).join('') : "<small>Пусто</small>";
    }

    function renderMarket() {
        document.getElementById('m-list').innerHTML = db.market.map(m => `
            <div class="card" style="text-align:center; margin:0; padding:10px">
                <b style="font-size:12px">${m.n}</b><br><small>${m.p} ₽</small><br>
                <button class="nav-btn" style="width:100%; font-size:8px; margin-top:5px" onclick="buyItem(${m.id})">ВЗЛОМАТЬ/КУПИТЬ</button>
            </div>
        `).join('');
    }

    function buyItem(id) {
        const item = db.market.find(x => x.id == id);
        const u = db.users[user];
        if(u.bal < item.p) return alert("НЕДОСТАТОЧНО СРЕДСТВ");
        u.bal -= item.p;
        u.inv.push(item);
        db.msgs.push({ u: "SYSTEM", t: `⚡ ${user} выкупил данные [${item.n}]`, c: "var(--neon-gold)" });
        save(); init();
    }

    function sendMsg() {
        const i = document.getElementById('chat-in');
        if(!i.value.trim()) return;
        db.msgs.push({ u: user, t: i.value, c: (user===MY_LOGIN?"var(--neon-gold)":"#fff") });
        if(db.msgs.length > 30) db.msgs.shift();
        i.value = ""; save(); renderChat();
    }

    function renderChat() {
        document.getElementById('chat').innerHTML = db.msgs.map(m => `<div><b style="color:${m.c}">${m.u}:</b> ${m.t}</div>`).join('');
        document.getElementById('chat').scrollTop = 9999;
    }

    function createItem() {
        const n = document.getElementById('adm-n').value, p = parseInt(document.getElementById('adm-p').value), link = document.getElementById('adm-link').value;
        if(n && p) { db.market.push({ id:Date.now(), n, p, link }); save(); init(); alert("Данные добавлены!"); }
    }

    function renderUsers() {
        document.getElementById('adm-users').innerHTML = Object.keys(db.users).map(n => `
            <div class="user-row"><span>${n} (${db.users[n].bal}₽)</span>
            <button class="nav-btn" style="font-size:8px" onclick="db.users['${n}'].bal+=500;save();init();">+500</button></div>
        `).join('');
    }

    function logout() { localStorage.removeItem('active_user'); location.reload(); }
</script>

</body>
</html>
