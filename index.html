<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CS2 MARKET — FINAL VERSION</title>
    <style>
        :root { 
            --primary: #0095ff; --bg: #0d1117; --panel: rgba(22, 27, 34, 0.85); 
            --text: #e6edf3; --gold: #ffcc00; --glow: 0 0 20px rgba(0, 149, 255, 0.4);
        }
        body { 
            background: url('https://wallpaperaccess.com') no-repeat center center fixed;
            background-size: cover; color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; backdrop-filter: brightness(0.5);
        }
        header { background: rgba(13, 17, 23, 0.9); padding: 10px 5%; border-bottom: 1px solid rgba(255,255,255,0.1); display: none; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
        .nav-btn { background: linear-gradient(135deg, #0095ff 0%, #0055ff 100%); color: #fff; border: none; padding: 8px 15px; cursor: pointer; font-weight: 600; border-radius: 6px; text-transform: uppercase; font-size: 11px; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .nav-btn:hover { box-shadow: 0 0 20px var(--primary); transform: translateY(-1px); }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; display: none; grid-template-columns: 1fr 320px 220px; gap: 15px; }
        .active-page { display: grid !important; }
        .card { background: var(--panel); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); }
        
        /* Смайлы */
        .emoji-picker { position: absolute; bottom: 50px; right: 0; background: #161b22; border: 1px solid var(--primary); padding: 8px; display: none; grid-template-columns: repeat(5, 1fr); gap: 5px; border-radius: 8px; z-index: 100; }
        .emoji-item { cursor: pointer; font-size: 18px; padding: 3px; }
        
        #auth-screen { position: fixed; inset: 0; background: url('https://wallpaperaccess.com') center/cover; z-index: 10000; display: flex; justify-content: center; align-items: center; }
        .auth-box { background: rgba(13, 17, 23, 0.9); padding: 35px; border-radius: 15px; border: 1px solid var(--primary); width: 340px; backdrop-filter: blur(15px); text-align: center; }
        input { width: 100%; padding: 10px; margin: 5px 0; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: #fff; box-sizing: border-box; }
        
        #chat-messages { height: 350px; overflow-y: auto; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; }
        .online-user { display: flex; align-items: center; gap: 8px; padding: 6px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 12px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #444; }
        .on { background: #00ff88; box-shadow: 0 0 8px #00ff88; }
    </style>
</head>
<body>

<header id="header">
    <div style="display:flex; align-items:center; gap:10px">
        <img id="h-ava" style="width:35px; height:35px; border-radius:8px; border:1px solid var(--primary)">
        <div><b id="h-name"></b><br><span id="h-bal" style="color:var(--primary); font-size:12px">0</span> ₽</div>
    </div>
    <div style="display:flex; gap:6px">
        <button class="nav-btn" onclick="openPage('shop')">МАРКЕТ</button>
        <button class="nav-btn" style="background:rgba(255,255,255,0.1)" onclick="openPage('roulette')">KISS</button>
        <button class="nav-btn" onclick="openPage('cart')">🛒 [<span id="cart-count">0</span>]</button>
        <button class="nav-btn" style="background:#ff9900" onclick="openPage('inventory')">МОИ ТОВАРЫ</button>
        <button id="admin-btn" class="nav-btn" style="display:none; background:var(--gold); color:#000" onclick="openPage('admin')">АДМИН</button>
        <button class="nav-btn" style="background:#ff3333" onclick="logout()">ВЫХОД</button>
    </div>
</header>

<div id="auth-screen">
    <div class="auth-box">
        <h2 id="auth-title" style="margin-top:0">CS2 MARKET</h2>
        <input type="text" id="u-login" placeholder="ЛОГИН / EMAIL">
        <input type="password" id="u-pass" placeholder="ПАРОЛЬ">
        <input type="email" id="u-email" placeholder="EMAIL" style="display:none">
        <div id="captcha-block" style="display:none; margin:10px 0; background:rgba(0,0,0,0.3); padding:10px; border-radius:8px">
            <p style="font-size:11px; margin:0">РЕШИТЕ: <b id="captcha-q" style="color:var(--primary)"></b></p>
            <input type="number" id="captcha-a" placeholder="ОТВЕТ">
        </div>
        <button class="nav-btn" style="width:100%; padding:12px" id="auth-main-btn" onclick="handleAuth()">ВОЙТИ</button>
        <div style="display:flex; gap:5px; margin-top:10px">
            <button class="nav-btn" style="flex:1; background:#333; font-size:9px" onclick="toggleAuth('reg')">РЕГИСТРАЦИЯ</button>
            <button class="nav-btn" style="flex:1; background:#222; font-size:9px" onclick="toggleAuth('reset')">ЗАБЫЛ ПАРОЛЬ</button>
        </div>
    </div>
</div>

<div class="container" id="main-content">
    <div id="pages">
        <div id="shop-page" class="card"><h2>МАРКЕТ</h2><div id="store-list"></div></div>
        <div id="cart-page" class="card" style="display:none"><h2>КОРЗИНА</h2><div id="cart-items"></div><p>ИТОГО: <b id="cart-total">0</b> ₽</p><button class="nav-btn" onclick="checkout()">КУПИТЬ</button></div>
        <div id="inventory-page" class="card" style="display:none"><h2>ИНВЕНТАРЬ</h2><div id="my-items"></div></div>
        <div id="admin-page" class="card" style="display:none"><h2>АДМИНКА</h2><div id="adm-users"></div></div>
    </div>

    <div class="card">
        <h4>ЧАТ</h4>
        <div id="chat-messages"></div>
        <div style="position:relative; display:flex; gap:5px; margin-top:10px">
            <button class="nav-btn" style="background:#444" onclick="toggleEmojis()">😊</button>
            <input type="text" id="chat-in" placeholder="SAY..." onkeypress="if(event.key==='Enter') sendChat()">
            <button class="nav-btn" onclick="sendChat()">OK</button>
            <div id="emoji-list" class="emoji-picker"></div>
        </div>
    </div>

    <div class="card">
        <h4>ОНЛАЙН (<span id="online-count">0</span>)</h4>
        <div id="online-list"></div>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('cs_db')) || {};
    if(!db['admin']) db['admin'] = {pass:'170', email:'a@a.ru', bal:5000, ava:'https://i.pravatar.cc', sale:0, inv:[], isAdm:true, lastSeen:Date.now()};
    else { db['admin'].pass = '170'; db['admin'].isAdm = true; }

    let chat = JSON.parse(localStorage.getItem('cs_chat')) || [];
    let cur = localStorage.getItem('active_user') || null;
    let authMode = 'login', capRes = 0, cart = [];

    const storeItems = [{id:1, n:"Army Ranks Ultimate", p:500, l:"https://disk.yandex.ru"}, {id:2, n:"Chat RBS", p:250, l:"https://disk.yandex.ru"}];
    const emojis = ['😊','😂','🔥','🔫','💀','😎','👍','💩','😱','🎮'];

    window.onload = () => { 
        if(cur && db[cur]) startSite(); 
        initEmojis(); 
        renderStore();
        setInterval(renderOnline, 5000); 
    };

    function toggleAuth(m) {
        authMode = (authMode === m) ? 'login' : m;
        document.getElementById('u-email').style.display = (authMode !== 'login') ? 'block' : 'none';
        document.getElementById('captcha-block').style.display = (authMode !== 'login') ? 'block' : 'none';
        if(authMode !== 'login') {
            const a = Math.floor(Math.random()*10), b = Math.floor(Math.random()*10);
            capRes = a + b; document.getElementById('captcha-q').innerText = `${a} + ${b} = ?`;
        }
    }

    function handleAuth() {
        const u = document.getElementById('u-login').value.trim().toLowerCase();
        const p = document.getElementById('u-pass').value;
        const e = document.getElementById('u-email').value.trim();
        const ans = parseInt(document.getElementById('captcha-a').value);

        if(authMode === 'reset') {
            if(ans !== capRes) return alert("Капча!");
            const f = Object.keys(db).find(k => db[k].email === e);
            return alert(f ? `Пароль: ${db[f].pass}` : "Не найдено");
        }
        if(authMode === 'reg') {
            if(ans !== capRes) return alert("Капча!");
            db[u] = {pass:p, email:e, bal:0, ava:'https://i.pravatar.cc, inv:[], lastSeen:Date.now()};
            save(); alert("ОК! Войдите."); toggleAuth('login'); return;
        }
        const found = db[u] ? u : Object.keys(db).find(k => db[k].email === u);
        if(found && db[found].pass === p) { cur = found; localStorage.setItem('active_user', cur); startSite(); }
        else alert("Ошибка!");
    }

    function startSite() {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('header').style.display = 'flex';
        document.getElementById('main-content').classList.add('active-page');
        if(cur==='admin' || db[cur].isAdm) document.getElementById('admin-btn').style.display = 'block';
        updateUI(); renderChat(); renderOnline();
    }

    function updateUI() {
        document.getElementById('h-name').innerText = cur.toUpperCase();
        document.getElementById('h-bal').innerText = db[cur].bal;
        document.getElementById('h-ava').src = db[cur].ava;
        document.getElementById('cart-count').innerText = cart.length;
        db[cur].lastSeen = Date.now(); save();
    }

    function openPage(p) {
        ['shop','cart','inventory','admin'].forEach(id => document.getElementById(id+'-page').style.display = (id===p)?'block':'none');
        if(p==='inventory') renderInv();
        if(p==='cart') renderCart();
        if(p==='admin') renderAdm();
    }

    function renderStore() {
        document.getElementById('store-list').innerHTML = storeItems.map(i => `
            <div style="display:flex; justify-content:space-between; margin-bottom:10px; padding:10px; background:rgba(255,255,255,0.05); border-radius:8px">
                <span>${i.n} (<b>${i.p}₽</b>)</span>
                <button class="nav-btn" onclick="addToCart(${i.id})">+</button>
            </div>`).join('');
    }

    function addToCart(id) {
        const item = storeItems.find(i => i.id === id);
        if(!cart.find(c => c.id === id)) { cart.push(item); updateUI(); }
    }

    function renderCart() {
        let total = cart.reduce((s,i)=>s+i.p,0);
        document.getElementById('cart-items').innerHTML = cart.map(i=>`<div>${i.n}</div>`).join('') || "Пусто";
        document.getElementById('cart-total').innerText = total;
    }

    function checkout() {
        let total = cart.reduce((s,i)=>s+i.p,0);
        if(db[cur].bal >= total && cart.length) {
            db[cur].bal -= total;
            cart.forEach(it => db[cur].inv.push({n:it.n, l:it.l, k:'LIC-'+Math.random().toString(36).substr(2,5).toUpperCase()}));
            cart = []; updateUI(); openPage('inventory'); alert("Успешно!");
        } else alert("Мало денег!");
    }

    function renderInv() {
        document.getElementById('my-items').innerHTML = db[cur].inv.map(i => `
            <div style="display:flex; justify-content:space-between; margin-bottom:10px; padding:10px; background:rgba(0,149,255,0.1); border-radius:8px">
                <div><b>${i.n}</b><br><small>${i.k}</small></div>
                <a href="${i.l}" target="_blank" class="nav-btn">СКАЧАТЬ</a>
            </div>`).join('') || "Пусто";
    }

    function initEmojis() {
        document.getElementById('emoji-list').innerHTML = emojis.map(e => `<span class="emoji-item" onclick="addEmoji('${e}')">${e}</span>`).join('');
    }
    function toggleEmojis() { const el = document.getElementById('emoji-list'); el.style.display = (el.style.display==='grid')?'none':'grid'; }
    function addEmoji(e) { document.getElementById('chat-in').value += e; toggleEmojis(); }

    function sendChat() {
        const i = document.getElementById('chat-in'); if(!i.value) return;
        chat.push({u:cur, m:i.value, a:db[cur].ava}); if(chat.length>30) chat.shift();
        i.value = ''; renderChat(); save();
    }
    function renderChat() {
        const isA = cur==='admin'||db[cur].isAdm;
        document.getElementById('chat-messages').innerHTML = chat.map((c,idx) => `
            <div class="msg"><b>${c.u}:</b> ${c.m} ${isA?`<span onclick="chat.splice(${idx},1);renderChat()" style="color:red; cursor:pointer">[X]</span>`:''}</div>`).join('');
        document.getElementById('chat-messages').scrollTop = 999;
    }

    function renderOnline() {
        const now = Date.now(); let c = 0;
        document.getElementById('online-list').innerHTML = Object.keys(db).map(u => {
            const on = (now - (db[u].lastSeen||0) < 300000); if(on) c++;
            return `<div class="online-user"><div class="status-dot ${on?'on':''}"></div>${u.toUpperCase()}</div>`;
        }).join('');
        document.getElementById('online-count').innerText = c;
    }

    function renderAdm() {
        document.getElementById('adm-users').innerHTML = Object.keys(db).map(u => `
            <div style="display:flex; justify-content:space-between; margin-bottom:5px">${u} (${db[u].bal}₽) 
            <button onclick="db['${u}'].bal+=500;save();renderAdm();updateUI()">+500</button></div>`).join('');
    }

    function save() { localStorage.setItem('cs_db', JSON.stringify(db)); localStorage.setItem('cs_chat', JSON.stringify(chat)); }
    function logout() { localStorage.removeItem('active_user'); location.reload(); }
    function openPage(p) {
        ['shop','cart','inventory','admin'].forEach(id => document.getElementById(id+'-page').style.display = (id===p)?'block':'none');
    }
</script>
</body>
</html>
