<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS 1.6 Market | Магазин плагинов</title>
    <style>
        :root { --main: #ff9d00; --bg: #0b0e11; --card: #161b22; --text: #c9d1d9; --green: #00ff41; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding-top: 60px; }
        
        /* Навигация */
        nav { background: #000; padding: 15px; position: fixed; width: 100%; top: 0; z-index: 1000; border-bottom: 2px solid var(--main); display: flex; justify-content: center; gap: 20px; box-sizing: border-box; }
        nav a { color: #fff; text-decoration: none; font-weight: bold; font-size: 13px; text-transform: uppercase; cursor: pointer; }

        .container { max-width: 1000px; margin: auto; padding: 20px; text-align: center; }

        /* Личный кабинет */
        .profile-box { background: var(--card); border: 2px solid var(--main); padding: 25px; border-radius: 15px; margin-bottom: 40px; box-shadow: 0 0 20px rgba(255, 157, 0, 0.1); }
        .hidden { display: none; }
        input { padding: 10px; margin: 5px; border-radius: 5px; border: 1px solid #333; background: #000; color: #fff; width: 200px; }
        
        /* Кнопки */
        .btn { background: var(--main); color: #000; padding: 12px 25px; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; text-transform: uppercase; transition: 0.3s; text-decoration: none; display: inline-block; }
        .btn:hover { background: #fff; transform: scale(1.05); }
        .btn-pay { background: var(--green); margin-top: 15px; }

        /* Товары */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: var(--card); border: 1px solid #333; padding: 25px; border-radius: 12px; }
        .price { font-size: 24px; color: #fff; font-weight: bold; margin: 15px 0; }

        .history { background: #000; border-radius: 10px; padding: 15px; margin-top: 20px; text-align: left; border: 1px solid #333; }
    </style>
</head>
<body>

<nav>
    <a onclick="location.reload()">Главная</a>
    <a href="#shop">Магазин</a>
    <a href="https://t.me">Поддержка</a>
</nav>

<div class="container">
    <h1>CS <span style="color:var(--main)">MARKET</span></h1>

    <!-- БЛОК ВХОДА / КАБИНЕТА -->
    <div id="auth-block" class="profile-box">
        <div id="login-form">
            <h3>🔐 Вход / Регистрация</h3>
            <input type="text" id="username" placeholder="Логин">
            <input type="password" id="password" placeholder="Пароль">
            <br><br>
            <button class="btn" onclick="login()">Войти в кабинет</button>
            <p style="font-size: 11px; opacity: 0.5;">*Введите <b>admin</b> чтобы получить 50,000 ₽</p>
        </div>

        <div id="user-profile" class="hidden">
            <h3>👤 Привет, <span id="display-name" style="color:var(--main)"></span>!</h3>
            <div style="font-size: 24px;">Баланс: <b id="user-balance" style="color:var(--green)">0</b> ₽</div>
            
            <!-- КНОПКА ОПЛАТЫ (Замени цифры на свой кошелек ЮMoney или ссылку на карту) -->
            <a href="https://yoomoney.ru" target="_blank" class="btn btn-pay">💳 ПОПОЛНИТЬ БАЛАНС</a>
            
            <div class="history">
                <h4 style="margin:0; color:var(--main);">📜 Ваши покупки:</h4>
                <div id="history-list"><p style="color:#666">Покупок нет</p></div>
            </div>
            <br>
            <button onclick="logout()" style="background:none; border:none; color:#666; cursor:pointer; text-decoration:underline;">Выйти</button>
        </div>
    </div>

    <!-- МАГАЗИН -->
    <h2 id="shop">ВИТРИНА ТОВАРОВ</h2>
    <div class="grid">
        <div class="card">
            <h3>VIP Gold Menu</h3>
            <p>Плагин на золотое оружие</p>
            <div class="price">250 ₽</div>
            <button class="btn" onclick="buy('VIP Gold Menu', 250, 'ССЫЛКА_НА_ФАЙЛ_1')">Купить</button>
        </div>
        <div class="card">
            <h3>Admin Skins</h3>
            <p>Набор моделей администратора</p>
            <div class="price">150 ₽</div>
            <button class="btn" onclick="buy('Admin Skins', 150, 'ССЫЛКА_НА_ФАЙЛ_2')">Купить</button>
        </div>
    </div>
</div>

<script>
    // Логика работы кабинета (LocalStorage)
    function login() {
        const name = document.getElementById('username').value.trim();
        if(name.length < 2) return alert("Введите логин!");
        localStorage.setItem('cs_user', name);
        if(name.toLowerCase() === 'admin') {
            localStorage.setItem('cs_balance', "50000");
        } else if (!localStorage.getItem('cs_balance')) {
            localStorage.setItem('cs_balance', "0");
        }
        updateUI();
    }

    function logout() {
        localStorage.removeItem('cs_user');
        location.reload();
    }

    function buy(name, price, link) {
        const user = localStorage.getItem('cs_user');
        if(!user) return alert("Сначала войдите в кабинет!");
        let bal = parseFloat(localStorage.getItem('cs_balance') || "0");
        let hist = JSON.parse(localStorage.getItem('cs_history') || "[]");
        
        if(hist.includes(name)) return alert("Уже куплено!");
        if(bal < price) return alert("Недостаточно денег! Пополните баланс кнопкой выше.");

        bal -= price;
        hist.push(name);
        localStorage.setItem('cs_balance', bal);
        localStorage.setItem('cs_history', JSON.stringify(hist));
        alert("Успешно! Ссылка в истории покупок.");
        updateUI();
    }

    function updateUI() {
        const user = localStorage.getItem('cs_user');
        if(user) {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('user-profile').classList.remove('hidden');
            document.getElementById('display-name').innerText = user;
            document.getElementById('user-balance').innerText = localStorage.getItem('cs_balance');
            
            const hist = JSON.parse(localStorage.getItem('cs_history') || "[]");
            const list = document.getElementById('history-list');
            if(hist.length > 0) {
                list.innerHTML = hist.map(i => `<div style="margin:5px 0;">✅ ${i} - <span style="color:var(--green)">Оплачено</span></div>`).join('');
            }
        }
    }
    updateUI();
</script>
</body>
</html>
