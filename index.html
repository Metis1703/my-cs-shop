<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CYBER_SYS — TOTAL RESTORE</title>
    <style>
        :root { 
            --neon-blue: #00f2ff; --neon-purple: #bc13fe; --neon-pink: #ff00de;
            --neon-gold: #ffcc00; --neon-green: #39ff14; --bg: #050505; --panel: rgba(15, 15, 20, 0.95); 
        }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }
        header { background: rgba(0,0,0,0.9); padding: 15px 5%; border-bottom: 2px solid var(--neon-purple); display: none; justify-content: space-between; align-items: center; position: sticky; top:0; z-index:100; }
        .nav-btn { background: transparent; color: var(--neon-blue); border: 1px solid var(--neon-blue); padding: 8px 16px; cursor: pointer; font-weight: bold; border-radius: 4px; text-transform: uppercase; font-size: 10px; transition: 0.3s; margin: 2px; }
        .nav-btn:hover { background: var(--neon-blue); color: #000; box-shadow: 0 0 15px var(--neon-blue); }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; display: none; grid-template-columns: 1fr 380px; gap: 25px; }
        .card { background: var(--panel); padding: 20px; border-radius: 15px; border: 1px solid rgba(0, 242, 255, 0.2); margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; background: rgba(255,255,255,0.05); border: 1px solid var(--neon-purple); border-radius: 5px; color: #fff; outline: none; box-sizing: border-box; }
        #auth-screen { position: fixed; inset: 0; background: #000; z-index: 10000; display: flex; justify-content: center; align-items: center; }
        .auth-box { background: #0a0a0a; padding: 35px; border-radius: 20px; border: 2px solid var(--neon-blue); width: 320px; text-align: center; }
        .badge { padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: bold; margin-left: 5px; color: #000; }
        .market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; }
        .inv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(45px, 1fr)); gap: 8px; }
        .user-row { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); align-items: center; }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="auth-box">
        <h1 style="color:var(--neon-blue); margin-top:0">CYBER_SYS</h1>
        <input type="text" id="u-login" placeholder="ЛОГИН">
        <input type="email" id="u-email" placeholder="EMAIL">
        <input type="password" id="u-pass" placeholder="ПАРОЛЬ">
        <button class="nav-btn" style="width:100%; padding:14px" onclick="auth()">ВХОД / РЕГИСТРАЦИЯ</button>
        <span style="color:var(--neon-pink); cursor:pointer; font-size:11px; display:block; margin-top:10px" onclick="recoverAccess()">ЗАБЫЛИ ПАРОЛЬ?</span>
    </div>
</div>

<header id="header">
    <div style="display:flex; align-items:center; gap:12px">
        <img id="h-ava" src="" style="width:45px; height:45px; border-radius:50%; border:2px solid var(--neon-blue); object-fit:cover">
        <div><b id="h-name"></b><span id="h-role"></span><br><span id="h-bal" style="color:var(--neon-pink)">0</span> ₽</div>
    </div>
    <div style="display:flex; gap:5px">
        <button id="admin-btn" class="nav-btn" style="border-color:var(--neon-gold); color:var(--neon-gold); display:none" onclick="openPage('admin')">👑 УПРАВЛЕНИЕ</button>
        <button class="nav-btn" onclick="openPage('shop')">МАРКЕТ</button>
        <button class="nav-btn" onclick="openPage('main')">ПРОФИЛЬ</button>
        <button class="nav-btn" style="border-color:red; color:red" onclick="logout()">ВЫЙТИ</button>
    </div>
</header>

<div class="container" id="main-content">
    <div id="pages">
        <!-- ПРОФИЛЬ -->
        <div id="page-main">
            <div class="card">
                <h3>🎒 МОЙ ИНВЕНТАРЬ</h3>
                <div id="u-inv" class="inv-grid"></div>
            </div>
            <div class="card">
                <h3>👥 МОИ КОНТАКТЫ</h3>
                <div style="display:flex; gap:10px"><input type="text" id="f-search" placeholder="Ник..."><button class="nav-btn" onclick="addFriend()">+</button></div>
                <div id="f-list" style="margin-top:10px"></div>
            </div>
            <div class="card">
                <h3 style="color:var(--neon-pink)">🆘 СВЯЗЬ С CORE</h3>
                <textarea id="ticket-text" placeholder="Опишите проблему..."></textarea>
                <button class="nav-btn" style="width:100%; border-color:var(--neon-pink); color:var(--neon-pink)" onclick="sendTicket()">ОТПРАВИТЬ ТИКЕТ</button>
            </div>
        </div>

        <!-- МАРКЕТ -->
        <div id="page-shop" style="display:none">
            <div class="card"><h3>🛒 МАРКЕТ СЕТИ</h3><div id="m-list" class="market-grid"></div></div>
        </div>

        <!-- АДМИНКА -->
        <div id="page-admin" style="display:none">
            <div class="card">
                <h3>📦 ВЫСТАВИТЬ ТОВАР</h3>
                <input type="text" id="adm-n" placeholder="Имя">
                <input type="number" id="adm-p" placeholder="Цена">
                <input type="text" id="adm-i" placeholder="Эмодзи">
                <button class="nav-btn" style="width:100%" onclick="createItem()">СОЗДАТЬ</button>
            </div>
            <div class="card"><h3>📩 ТИКЕТЫ / ЮЗЕРЫ</h3><div id="adm-data"></div></div>
        </div>
    </div>

    <div class="sidebar">
        <div class="card">
            <h4>💬 ЧАТ</h4>
            <div id="chat" style="height:350px; overflow-y:auto; font-size:13px; margin-bottom:10px"></div>
            <input type="text" id="chat-in" placeholder="Связь..." onkeypress="if(event.key==='Enter') sendMsg()">
        </div>
    </div>
</div>

<script>
    const OWNER = "admin";
    // ЕДИНАЯ БАЗА
    let db = JSON.parse(localStorage.getItem('CYBER_ULTIMATE_STORAGE')) || { users: {}, msgs: [], market: [], tickets: [] };
    let user = localStorage.getItem('cyber_user');

    function save() { localStorage.setItem('CYBER_ULTIMATE_STORAGE', JSON.stringify(db)); }

    function auth() {
        const l = document.getElementById('u-login').value.trim();
        const e = document.getElementById('u-email').value.trim();
        const p = btoa(document.getElementById('u-pass').value);
        if(!l || !p) return;

        if(!db.users[l]) {
            // Проверка уникальности
            if(Object.values(db.users).some(u => u.email === e)) return alert("Email занят!");
            db.users[l] = { pass: p, email: e, bal: 500, inv: [], friends: [], isAdmin: false, isBanned: false, ava: "https://api.dicebear.com"+l };
        } else {
            if(db.users[l].isBanned) return alert("ДОСТУП ЗАБЛОКИРОВАН");
            if(db.users[l].pass !== p) return alert("Пароль неверный!");
        }
        user = l; localStorage.setItem('cyber_user', l); save(); location.reload();
    }

    if(user && db.users[user]) {
        const u = db.users[user];
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('header').style.display = 'flex';
        document.getElementById('main-content').style.display = 'grid';
        document.getElementById('h-name').innerText = user;
        document.getElementById('h-bal').innerText = u.bal;
        document.getElementById('h-ava').src = u.ava;
        
        if(user === OWNER || u.isAdmin) {
            document.getElementById('admin-btn').style.display = 'block';
            document.getElementById('h-role').innerHTML = user === OWNER ? '<span class="badge" style="background:var(--neon-gold)">OWNER</span>' : '<span class="badge" style="background:var(--neon-green)">ADMIN</span>';
        }
        renderAll(); setInterval(renderChat, 3000);
    }

    function renderAll() {
        const u = db.users[user];
        document.getElementById('u-inv').innerHTML = (u.inv || []).map(i => `<div style="background:rgba(0,242,255,0.1); border:1px solid var(--neon-blue); text-align:center; border-radius:5px; padding:5px" title="${i.n}">${i.i}</div>`).join('');
        document.getElementById('f-list').innerHTML = u.friends.map(f => `<div class="user-row"><span>${f}</span><button onclick="remFriend('${f}')" style="background:none;border:none;color:red;cursor:pointer">✕</button></div>`).join('');
        renderMarket(); renderChat(); if(user === OWNER || db.users[user].isAdmin) renderAdmin();
    }

    function createItem() {
        const n = document.getElementById('adm-n').value, p = parseInt(document.getElementById('adm-p').value), i = document.getElementById('adm-i').value;
        if(n && p) { db.market.push({ id: Date.now(), n, p, i: i || "📦" }); save(); renderMarket(); }
    }

    function renderMarket() {
        document.getElementById('m-list').innerHTML = db.market.map(m => `
            <div class="card" style="text-align:center; margin:0">
                <div style="font-size:25px">${m.i}</div><b>${m.n}</b><br><small>${m.p} ₽</small><br>
                <button class="nav-btn" style="width:100%; margin-top:5px" onclick="buy('${m.id}')">BUY</button>
            </div>
        `).join('');
    }

    function buy(id) {
        const it = db.market.find(x => x.id == id);
        if(db.users[user].bal >= it.p) {
            db.users[user].bal -= it.p;
            db.users[user].inv.push(it);
            save(); renderAll(); alert("Приобретено!");
        } else alert("Недостаточно средств!");
    }

    function renderAdmin() {
        const data = document.getElementById('adm-data');
        let html = "<h4>ТИКЕТЫ:</h4>" + db.tickets.map(t => `<div style="font-size:10px; margin-bottom:5px; border-left:2px solid gold; padding-left:5px"><b>${t.from}:</b> ${t.text}</div>`).join('');
        html += "<h4 style='margin-top:20px'>ЮЗЕРЫ:</h4>" + Object.keys(db.users).map(n => `
            <div class="user-row">
                <span style="${db.users[n].isBanned?'color:red':''}">${n}</span>
                <div>
                    <button class="nav-btn" style="font-size:8px" onclick="db.users['${n}'].bal+=500;save();renderAll();">+500</button>
                    <button class="nav-btn" style="font-size:8px; border-color:red" onclick="db.users['${n}'].isBanned=!db.users['${n}'].isBanned;save();renderAdmin();">BAN</button>
                    ${user===OWNER?`<button class="nav-btn" style="font-size:8px; border-color:var(--neon-green)" onclick="db.users['${n}'].isAdmin=!db.users['${n}'].isAdmin;save();renderAdmin();">ADM</button>`:''}
                </div>
            </div>
        `).join('');
        data.innerHTML = html;
    }

    function sendTicket() {
        const t = document.getElementById('ticket-text').value;
        if(t) { db.tickets.push({from:user, text:t}); save(); alert("Отправлено!"); document.getElementById('ticket-text').value=""; }
    }

    function addFriend() {
        const n = document.getElementById('f-search').value.trim();
        if(db.users[n] && n!==user) { db.users[user].friends.push(n); save(); renderAll(); }
    }
    function remFriend(n) { db.users[user].friends = db.users[user].friends.filter(x=>x!==n); save(); renderAll(); }

    function sendMsg() {
        const i = document.getElementById('chat-in');
        db.msgs.push({ u: user, t: i.value }); save(); i.value = ""; renderChat();
    }
    function renderChat() {
        document.getElementById('chat').innerHTML = db.msgs.map(m => `<div><b>${m.u}:</b> ${m.t}</div>`).join('');
        document.getElementById('chat').scrollTop = 99999;
    }

    function openPage(p) { ["page-main", "page-shop", "page-admin"].forEach(id => document.getElementById(id).style.display = id.includes(p) ? 'block' : 'none'); }
    function logout() { localStorage.removeItem('cyber_user'); location.reload(); }
    function recoverAccess() { 
        const e = prompt("Email:");
        const u = Object.keys(db.users).find(k => db.users[k].email === e);
        if(u) alert("Логин: "+u+"\nПароль: "+atob(db.users[u].pass));
    }
</script>
</body>
</html>
