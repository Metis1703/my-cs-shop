<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CYBER MARKET — SOCIAL HUB</title>
    <style>
        :root { 
            --neon-blue: #00f2ff; --neon-purple: #bc13fe; --neon-pink: #ff00de;
            --neon-gold: #ffcc00; --neon-green: #39ff14; --bg: #050505; --panel: rgba(15, 15, 20, 0.95); 
        }
        body { 
            background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden;
            background-image: radial-gradient(circle at 20% 30%, rgba(188, 19, 254, 0.1) 0%, transparent 40%);
        }
        header { background: rgba(0, 0, 0, 0.9); padding: 15px 5%; border-bottom: 2px solid var(--neon-purple); display: none; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 0 20px var(--neon-purple); }
        .nav-btn { background: transparent; color: var(--neon-blue); border: 1px solid var(--neon-blue); padding: 8px 16px; cursor: pointer; font-weight: bold; border-radius: 4px; text-transform: uppercase; font-size: 10px; transition: 0.3s; margin: 2px; }
        .nav-btn:hover { background: var(--neon-blue); color: #000; box-shadow: 0 0 20px var(--neon-blue); }
        .container { max-width: 1300px; margin: 20px auto; padding: 0 20px; display: none; grid-template-columns: 1fr 380px; gap: 25px; }
        .card { background: var(--panel); padding: 20px; border-radius: 15px; border: 1px solid rgba(0, 242, 255, 0.2); margin-bottom: 20px; }
        
        .avatar-gallery { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin: 15px 0; }
        .ava-option { width: 50px; height: 50px; border: 2px solid #333; border-radius: 50%; cursor: pointer; transition: 0.3s; object-fit: cover; }
        .ava-option:hover, .ava-active { border-color: var(--neon-blue); transform: scale(1.1); box-shadow: 0 0 10px var(--neon-blue); }

        .color-picker { display: flex; gap: 10px; margin-top: 10px; }
        .color-opt { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
        .color-opt:hover { transform: scale(1.2); }
        
        /* СТИЛЬ СПИСКА ДРУЗЕЙ */
        .friend-count { font-size: 14px; color: var(--neon-purple); font-weight: bold; letter-spacing: 1px; border-bottom: 1px solid rgba(188, 19, 254, 0.3); padding-bottom: 5px; margin-bottom: 10px; display: block; }
        .friend-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }

        #chat-box { height: 300px; overflow-y: auto; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px; font-size: 13px; border: 1px solid rgba(255,255,255,0.05); }
        #auth-screen { position: fixed; inset: 0; background: #000; z-index: 10000; display: flex; justify-content: center; align-items: center; }
        .auth-box { background: #0a0a0a; padding: 40px; border-radius: 20px; border: 2px solid var(--neon-blue); width: 340px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: rgba(255,255,255,0.05); border: 1px solid var(--neon-purple); border-radius: 5px; color: #fff; outline: none; box-sizing: border-box; }
    </style>
</head>
<body>

<header id="header">
    <div style="display:flex; align-items:center; gap:12px">
        <img id="h-ava-img" src="" style="width:40px; height:40px; border-radius:50%; border:2px solid var(--neon-blue); object-fit:cover">
        <div><b id="h-name"></b><br><span id="h-bal" style="color:var(--neon-pink)">0</span> <small>₽</small></div>
    </div>
    <div style="display:flex; gap:5px">
        <button id="admin-btn" class="nav-btn" style="border-color:var(--neon-gold); color:var(--neon-gold); display:none" onclick="openPage('admin')">👑 АДМИН</button>
        <button class="nav-btn" onclick="openPage('shop')">МАРКЕТ</button>
        <button class="nav-btn" style="border-color:var(--neon-pink); color:var(--neon-pink)" onclick="openPage('profile')">ПРОФИЛЬ</button>
        <button class="nav-btn btn-red" style="border-color:#ff3333; color:#ff3333" onclick="logout()">ВЫХОД</button>
    </div>
</header>

<div id="auth-screen">
    <div class="auth-box">
        <h1 style="color:var(--neon-blue); margin-top:0">CYBER_SYS</h1>
        <input type="text" id="u-login" placeholder="ЛОГИН">
        <input type="password" id="u-pass" placeholder="ПАРОЛЬ">
        <button class="nav-btn" style="width:100%; padding:14px" onclick="handleAuth()">ВХОД</button>
        <p onclick="toggleReg()" id="t-reg" style="font-size:11px; cursor:pointer; color:var(--neon-purple); margin-top:15px">РЕГИСТРАЦИЯ</p>
    </div>
</div>

<div class="container" id="main-content">
    <div id="pages">
        <div id="shop-page" class="card"><h3>🛒 МАРКЕТ</h3><div id="store-list"></div></div>
        
        <div id="profile-page" style="display:none">
            <div class="card">
                <h3>👤 НЕОНОВЫЙ АВАТАР</h3>
                <div class="avatar-gallery" id="ava-picker"></div>
            </div>
            <div class="card">
                <h3>🌈 ЦВЕТ НИКА</h3>
                <div class="color-picker" id="color-picker"></div>
            </div>
            <div class="card">
                <h3>👥 ДРУЗЬЯ (<span id="p-friend-count">0</span>)</h3>
                <input type="text" id="friend-add-id" placeholder="Логин для поиска...">
                <button class="nav-btn" style="width:100%" onclick="addFriend()">ДОБАВИТЬ В ДРУЗЬЯ</button>
                <div id="friend-list-box" style="margin-top:15px"></div>
            </div>
            <div class="card">
                <p>Баланс: <b id="p-bal" style="color:var(--neon-pink)">0</b> ₽</p>
                <button class="nav-btn" onclick="addMoney()">ПОПОЛНИТЬ</button>
            </div>
        </div>

        <div id="admin-page" class="card" style="display:none"><h3>👑 ROOT</h3><div id="admin-user-list"></div></div>
    </div>

    <div class="sidebar">
        <div class="card">
            <h4>💬 ЧАТ СЕТИ</h4>
            <div id="chat-box"></div>
            <input type="text" id="chat-in" onkeypress="if(event.key==='Enter') sendChat()">
        </div>
    </div>
</div>

<script>
    const ADMIN_ID = "admin";
    const cyberpunkAvatars = [
        "https://api.dicebear.com",
        "https://api.dicebear.com",
        "https://api.dicebear.com",
        "https://api.dicebear.com",
        "https://api.dicebear.com",
        "https://api.dicebear.com"
    ];
    const neonColors = ["#00f2ff", "#ff00de", "#bc13fe", "#39ff14", "#ffcc00", "#ffffff"];

    let db = JSON.parse(localStorage.getItem('cs_db')) || {};
    let currentUser = localStorage.getItem('active_user') || null;
    let isRegMode = false;

    if (!db[ADMIN_ID]) { db[ADMIN_ID] = { pass: btoa("creator777"), bal: 5000, ava: cyberpunkAvatars, color: "#ffcc00", friends: [], inv: [] }; save(); }

    window.onload = () => { if(currentUser && db[currentUser]) startSite(); };

    function startSite() {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('header').style.display = 'flex';
        document.getElementById('main-content').style.display = 'grid';
        document.getElementById('h-name').innerText = currentUser;
        document.getElementById('h-ava-img').src = db[currentUser].ava;
        updateUI();
        renderPickers();
    }

    function renderPickers() {
        document.getElementById('ava-picker').innerHTML = cyberpunkAvatars.map(url => `<img src="${url}" class="ava-option ${db[currentUser].ava === url ? 'ava-active' : ''}" onclick="setAvatar('${url}')">`).join('');
        document.getElementById('color-picker').innerHTML = neonColors.map(color => `<div class="color-opt" style="background:${color}" onclick="setNicknameColor('${color}')"></div>`).join('');
    }

    function setAvatar(url) { db[currentUser].ava = url; save(); document.getElementById('h-ava-img').src = url; renderPickers(); }
    function setNicknameColor(color) { db[currentUser].color = color; save(); alert("Цвет изменен!"); }

    function addFriend() {
        const f = document.getElementById('friend-add-id').value.trim();
        if(!db[f] || f === currentUser) return alert("Пользователь не найден");
        if(db[currentUser].friends.includes(f)) return alert("Уже в друзьях");
        db[currentUser].friends.push(f);
        save();
        updateUI();
        document.getElementById('friend-add-id').value = "";
    }

    function updateUI() {
        document.getElementById('h-bal').innerText = db[currentUser].bal;
        if(document.getElementById('p-bal')) document.getElementById('p-bal').innerText = db[currentUser].bal;
        if(currentUser === ADMIN_ID) document.getElementById('admin-btn').style.display = 'block';
        
        // ОБНОВЛЕНИЕ СПИСКА ДРУЗЕЙ
        const fList = db[currentUser].friends || [];
        document.getElementById('p-friend-count').innerText = fList.length;
        document.getElementById('friend-list-box').innerHTML = fList.map(f => `
            <div class="friend-row">
                <span>👤 ${f}</span>
                <span style="color:var(--neon-green); font-size:9px">ONLINE</span>
            </div>
        `).join('') || "<small style='opacity:0.5'>Список друзей пуст</small>";

        renderStore();
    }

    function handleAuth() {
        const l = document.getElementById('u-login').value.trim();
        const p = btoa(document.getElementById('u-pass').value);
        if(isRegMode) {
            db[l] = { pass: p, bal: 0, ava: cyberpunkAvatars, color: "#00f2ff", friends: [], inv: [] };
            save(); toggleReg(); alert("ID СОЗДАН!");
        } else {
            if(db[l] && db[l].pass === p) { currentUser = l; localStorage.setItem('active_user', l); startSite(); }
            else alert("ОШИБКА");
        }
    }

    function sendChat() {
        const inp = document.getElementById('chat-in');
        if(!inp.value) return;
        const color = db[currentUser].color || "#fff";
        document.getElementById('chat-box').innerHTML += `<div><b style="color:${color}">${currentUser}:</b> ${inp.value}</div>`;
        inp.value = '';
    }

    function renderStore() {
        document.getElementById('store-list').innerHTML = `<div class="friend-row"><span>Plugin Mod V1</span><button class="nav-btn" onclick="alert('Куплено')">500 ₽</button></div>`;
    }

    function openPage(p) { ['shop-page', 'profile-page', 'admin-page'].forEach(id => document.getElementById(id).style.display = 'none'); document.getElementById(p + '-page').style.display = 'block'; }
    function toggleReg() { isRegMode = !isRegMode; document.getElementById('t-reg').innerText = isRegMode ? "ВХОД" : "РЕГИСТРАЦИЯ"; }
    function addMoney() { db[currentUser].bal += 500; save(); updateUI(); }
    function save() { localStorage.setItem('cs_db', JSON.stringify(db)); }
    function logout() { localStorage.removeItem('active_user'); location.reload(); }
</script>
</body>
</html>
